name: vfox_plus
description: Material 3 Expressive desktop GUI for the vfox version manager.
publish_to: none
version: 0.1.0+1
repository: https://github.com/version-fox/vfox-plus

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

# Every runtime dependency must be licensed under terms that are compatible
# with, or no more restrictive than, the Apache License 2.0.
# See ../docs/architecture.md#dependencies before adding a new one.
dependencies:
  flutter:
    sdk: flutter
  # Required by the code that `flutter gen-l10n` generates.
  flutter_localizations:
    sdk: flutter
  # BSD-3-Clause. Flutter's maintained Material components, decoupled from the SDK.
  material_ui: ^1.8.0
  # BSD-3-Clause. Fade-through and shared-axis transitions.
  animations: ^3.0.0
  # Apache-2.0. System accent colour (XDG portal / GTK) for dynamic colour.
  dynamic_color: ^2.1.0
  # BSD-3-Clause. Native GTK file chooser.
  file_selector: ^1.1.0
  # BSD-3-Clause.
  intl: any
  # MIT. Port of androidx.graphics.shapes: Material shapes and shape morphing.
  material_new_shapes: ^1.0.0
  # BSD-3-Clause. Opens plugin homepages in the default browser.
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Apache-2.0. Only used by tool/generate_icon_font.dart as the source of the
  # Material Symbols font; it is never bundled into the application.
  material_symbols_icons: ^4.2960.0

flutter:
  generate: true
  # A few material_ui widgets draw glyphs from the Material Icons font
  # internally. Release builds tree-shake it down to those glyphs.
  uses-material-design: true
  fonts:
    # A subset of Material Symbols Rounded that keeps every variable axis,
    # generated by `dart run tool/generate_icon_font.dart` (not committed).
    - family: MaterialSymbolsRounded
      fonts:
        - asset: assets/fonts/MaterialSymbolsRounded.ttf
  assets:
    - assets/brand/
    # Shown on the license page; see lib/src/ui/licenses.dart.
    - assets/fonts/MaterialSymbolsRounded-LICENSE.txt
