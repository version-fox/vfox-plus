# The memory of the implementation in a pull request. The workflow of the
# mygo implementation measures the application and uploads the result as the
# artifact memory-mygo. When it has ended for the latest commit of a pull
# request, this workflow writes one comment on it: the memory with the
# difference from the latest numbers of main. Later runs replace that comment
# instead of adding another one
# (.github/scripts/memory_report.py; docs/memory.md#memory-in-pull-requests).
#
# It runs after the workflow of the pull request, in the context of the default
# branch, so that it can write to pull requests of forks, which a pull_request
# workflow cannot. For the same reason it never runs code of the pull request:
# it checks out main, and the artifacts it downloads are data, of which the
# script only reads numbers.
#
# Run it by hand to write the report of a pull request again:
#   gh workflow run memory.yml -f pull_request=<number>
name: Memory

on:
  workflow_run:
    # The workflow that measures the implementation, by name. Keep this in sync
    # with MEMORY_IMPLEMENTATIONS below, which has its file name.
    workflows: [mygo]
    types: [completed]
  workflow_dispatch:
    inputs:
      pull_request:
        description: The number of the pull request to write the report of now
        required: true
        type: number

permissions:
  actions: read
  contents: read
  pull-requests: write

concurrency:
  # The run of a commit ends and then starts a report. Reports run one at a
  # time, so that two of them cannot both write the comment.
  group: memory-${{ github.event.workflow_run.head_sha || format('pull-request-{0}', inputs.pull_request) }}
  cancel-in-progress: false

env:
  # The file name of the workflow of the implementation (without .yml), which
  # is also the name of its directory and of its artifact.
  MEMORY_IMPLEMENTATIONS: mygo

jobs:
  report:
    name: Write the report
    # Forks do not run CI.
    if: >-
      github.repository == 'version-fox/vfox-plus' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Write the report
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          PULL_REQUEST: ${{ inputs.pull_request }}
        run: |
          if [[ -n "$RUN_ID" ]]; then
            python3 .github/scripts/memory_report.py --run "$RUN_ID"
          else
            python3 .github/scripts/memory_report.py --pull-request "$PULL_REQUEST"
          fi
