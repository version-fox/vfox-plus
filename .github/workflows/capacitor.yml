# The Capacitor implementation: formatting, type checks, ESLint, the unit
# tests with the coverage gate, the license check of the npm packages, the
# end-to-end scenarios (against captured output and against the real vfox),
# the memory measurement and the Linux packages.
# capacitor/sandbox/run-task.sh runs the same steps locally; keep them in sync.
# The tool versions are in capacitor/versions.env, web/versions.env (Node.js)
# and capacitor/package.json (Electron).
name: Capacitor

on:
  push:
    branches: [main]
    paths:
      - capacitor/**
      - web/src/**
      - web/dev-host/**
      - web/e2e/**
      - shared/**
      - .github/workflows/capacitor.yml
  pull_request:
    paths:
      - capacitor/**
      - web/src/**
      - web/dev-host/**
      - web/e2e/**
      - shared/**
      - .github/workflows/capacitor.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The libraries of the Electron runtime, the icon font, the virtual display
  # and the package checks.
  LINUX_PACKAGES: >-
    libasound2t64 libatk-bridge2.0-0t64 libatk1.0-0t64 libatspi2.0-0t64 libcairo2 libcups2t64 libdbus-1-3
    libexpat1 libgbm1 libglib2.0-0t64 libglib2.0-bin libgtk-3-0t64 libnspr4 libnss3 libpango-1.0-0 libudev1
    libx11-6 libxcb1 libxcomposite1 libxdamage1 libxext6 libxfixes3 libxkbcommon0 libxrandr2 xdg-utils
    fonttools python3-brotli xvfb xauth dbus-x11 lintian desktop-file-utils
  # The setuid helper of the Chromium sandbox is not root's in node_modules,
  # and the runners do not allow user namespaces; the packages keep the sandbox.
  ELECTRON_DISABLE_SANDBOX: 1

jobs:
  build:
    name: Check, test end to end and package
    # Forks do not run CI.
    if: github.repository == 'version-fox/vfox-plus'
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: capacitor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the pinned versions
        working-directory: .
        run: grep -hE '^[A-Z0-9_]+=' web/versions.env capacitor/versions.env >> "$GITHUB_ENV"
      - name: Install the Linux packages
        uses: ./.github/actions/install-linux-packages
        with:
          packages: ${{ env.LINUX_PACKAGES }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: capacitor/package-lock.json
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/material-symbols
            ~/.cache/electron
          key: capacitor-runtime-${{ hashFiles('shared/tools/icon_font.py', 'capacitor/package-lock.json') }}
      - name: Install the packages and the Electron runtime
        run: |
          npm ci
          npm run electron
      - name: Build the assets and check the licenses
        run: |
          python3 ../shared/tools/icon_font.py download ~/.cache/material-symbols
          VFOX_PLUS_SYMBOLS="$HOME/.cache/material-symbols" npm run assets
      - name: Check formatting
        run: npm run format:check
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test with the coverage gate
        run: npm run test:coverage
      - name: Install vfox
        run: |
          archive="vfox_${VFOX_VERSION}_linux_x86_64"
          curl -fsSL --retry 5 -o "$RUNNER_TEMP/$archive.tar.gz" \
            "https://github.com/version-fox/vfox/releases/download/v$VFOX_VERSION/$archive.tar.gz"
          echo "$VFOX_SHA256  $RUNNER_TEMP/$archive.tar.gz" | sha256sum --check --strict -
          tar -xzf "$RUNNER_TEMP/$archive.tar.gz" -C "$RUNNER_TEMP"
          echo "VFOX_PLUS_E2E_VFOX=$RUNNER_TEMP/$archive/vfox" >> "$GITHUB_ENV"
      - name: Build the end-to-end test build
        run: npm run build:e2e
      - name: Run the end-to-end scenarios in a virtual display
        env:
          # The "measure" scenario writes its numbers here for memory.yml.
          VFOX_PLUS_MEASURE_OUTPUT: ${{ runner.temp }}/memory/memory.txt
        run: |
          for scenario in fake real measure; do
            xvfb-run -a -s "-screen 0 1280x800x24" dbus-run-session -- \
              bash ../web/e2e/run.sh "$scenario" "$PWD/node_modules/electron/dist/electron" "$PWD/dist/app-e2e"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: memory-capacitor
          path: ${{ runner.temp }}/memory/memory.txt
          if-no-files-found: error
          overwrite: true
      - name: Build the release
        run: |
          npm run build
          npm run stage
      - name: Smoke test the release
        run: |
          binary="$PWD/dist/stage/vfox-plus"
          xvfb-run -a -s "-screen 0 1280x800x24" "$binary" > app.log 2>&1 &
          sleep 15
          if ! pgrep -f "^$binary" > /dev/null; then
            cat app.log
            echo "::error::vfox+ exited during startup"
            exit 1
          fi
          pkill -f "^$binary"
      - name: Build the .deb and the tarball
        # Reproducible timestamps in the package metadata.
        run: SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" bash tools/package.sh ../dist
      - name: Validate the packages
        working-directory: .
        run: |
          desktop-file-validate shared/packaging/linux/dev.vfox.VfoxPlus.desktop
          # CI packages carry a placeholder maintainer; releases set DEB_MAINTAINER.
          lintian --fail-on error --suppress-tags malformed-contact,bogus-mail-host-in-debian-changelog dist/*.deb
      - name: Install the .deb into a clean Ubuntu container
        working-directory: .
        # The application must start with nothing but the declared dependencies.
        # Chromium needs more shared memory than Docker gives containers.
        run: |
          docker run --rm --init --shm-size=1g \
            --volume "$PWD/shared/sandbox/task-lib.sh:/task-lib.sh:ro" \
            --volume "$PWD/capacitor/sandbox/run-task.sh:/run-task.sh:ro" \
            --volume "$PWD/dist:/pkg:ro" \
            --env TASK_LIB=/task-lib.sh \
            ubuntu:26.04 bash /run-task.sh install-test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vfox-plus-capacitor-linux-x64
          path: dist/*
          if-no-files-found: error
