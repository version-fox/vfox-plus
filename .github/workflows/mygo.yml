# The application: formatting, golangci-lint and the unit tests (with
# coverage gates), the end-to-end scenarios in the application (against captured
# output and against the real vfox), the Linux packages and the Windows MSIX
# bundle.
# shared/tooling/internal/runtask runs the same steps locally; keep them in sync.
# The tool versions are in mygo/versions.env (Node.js only runs the test
# server of the end-to-end scenarios).
name: mygo

on:
  push:
    branches: [main]
    paths:
      - mygo/**
      - shared/**
      - .github/workflows/mygo.yml
  pull_request:
    paths:
      - mygo/**
      - shared/**
      - .github/workflows/mygo.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Packages needed to build and run mygo applications on Linux: nothing to
  # build with (mygo needs no C compiler, and only the race detector of the tests
  # needs one), GTK 3 to run, which mygo loads when it starts. Fontconfig and the
  # fonts are what the interface looks up.
  LINUX_PACKAGES: >-
    build-essential libgtk-3-0t64 fontconfig fonts-ubuntu fonts-noto-cjk
    xvfb xauth dbus-x11 lintian desktop-file-utils

jobs:
  build:
    name: Check, test end to end and package
    # Forks do not run CI.
    if: github.repository == 'version-fox/vfox-plus'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the pinned versions
        run: grep -hE '^[A-Z0-9_]+=' mygo/versions.env >> "$GITHUB_ENV"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: mygo/go.sum
      - name: Install the Linux packages
        uses: ./.github/actions/install-linux-packages
        with:
          packages: ${{ env.LINUX_PACKAGES }}
      - name: Install golangci-lint
        run: |
          archive="golangci-lint-$GOLANGCI_LINT_VERSION-linux-amd64"
          curl -fsSL --retry 5 -o "$RUNNER_TEMP/$archive.tar.gz" \
            "https://github.com/golangci/golangci-lint/releases/download/v$GOLANGCI_LINT_VERSION/$archive.tar.gz"
          echo "$GOLANGCI_LINT_SHA256  $RUNNER_TEMP/$archive.tar.gz" | sha256sum --check --strict -
          tar -xzf "$RUNNER_TEMP/$archive.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$archive" >> "$GITHUB_PATH"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Where vfxtool prepare keeps the variable font it downloads.
          path: ~/.cache/vfox-plus/material-symbols
          key: material-symbols-${{ hashFiles('shared/tooling/internal/iconfont/**') }}
      - name: Build vfxtool
        run: go -C shared/tooling build -o "$RUNNER_TEMP/vfxtool" ./cmd/vfxtool
      - name: Prepare the embedded assets
        # The icon font, the translations and the licenses of the Go modules.
        run: '"$RUNNER_TEMP/vfxtool" prepare --root mygo'
      - name: Build the release
        run: '"$RUNNER_TEMP/vfxtool" build --root mygo mygo/build/vfox-plus'
      - name: Verify the modules
        working-directory: mygo
        run: go mod verify
      - name: Check formatting
        working-directory: mygo
        run: golangci-lint fmt --diff
      - name: Lint
        working-directory: mygo
        run: |
          golangci-lint run
          golangci-lint run --build-tags e2e
      - name: Test
        working-directory: mygo
        run: |
          go vet ./...
          # The race detector needs cgo; the application is built without it.
          CGO_ENABLED=1 go test -race -coverprofile=coverage.out ./...
          "$RUNNER_TEMP/vfxtool" coverage coverage.out 85
      - name: Test vfxtool
        run: |
          go -C shared/tooling vet ./...
          go -C shared/tooling test ./...
      - name: Install vfox
        run: |
          archive="vfox_${VFOX_VERSION}_linux_x86_64"
          curl -fsSL --retry 5 -o "$RUNNER_TEMP/$archive.tar.gz" \
            "https://github.com/version-fox/vfox/releases/download/v$VFOX_VERSION/$archive.tar.gz"
          echo "$VFOX_SHA256  $RUNNER_TEMP/$archive.tar.gz" | sha256sum --check --strict -
          tar -xzf "$RUNNER_TEMP/$archive.tar.gz" -C "$RUNNER_TEMP"
          echo "VFOX_PLUS_E2E_VFOX=$RUNNER_TEMP/$archive/vfox" >> "$GITHUB_ENV"
      - name: Run the end-to-end scenarios in a virtual display
        env:
          # The "measure" scenario writes its numbers here for memory.yml.
          VFOX_PLUS_MEASURE_OUTPUT: ${{ runner.temp }}/memory/memory.txt
        run: |
          "$RUNNER_TEMP/vfxtool" build --e2e --root mygo "$RUNNER_TEMP/vfox-plus-e2e"
          for scenario in fake real; do
            xvfb-run -a -s "-screen 0 1280x800x24" dbus-run-session -- \
              "$RUNNER_TEMP/vfxtool" e2e-run "$scenario" "$RUNNER_TEMP/vfox-plus-e2e"
          done
          xvfb-run -a -s "-screen 0 1280x800x24" dbus-run-session -- \
            "$RUNNER_TEMP/vfxtool" measure "$RUNNER_TEMP/vfox-plus-e2e"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: memory-mygo
          path: ${{ runner.temp }}/memory/memory.txt
          if-no-files-found: error
          overwrite: true
      - name: Smoke test the release
        run: '"$RUNNER_TEMP/vfxtool" smoke-test --log app.log mygo/build/vfox-plus'
      - name: Build the .deb and the tarball
        run: |
          install -D -m 755 mygo/build/vfox-plus "$RUNNER_TEMP/stage/vfox-plus"
          # Reproducible timestamps in the package metadata.
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" "$RUNNER_TEMP/vfxtool" build-deb \
            --package vfox-plus --version "$(tr -d '[:space:]' < mygo/VERSION)" \
            --stage "$RUNNER_TEMP/stage" --executable vfox-plus --technology mygo \
            --depends "$("$RUNNER_TEMP/vfxtool" runtask print-depends)" \
            --recommends "$("$RUNNER_TEMP/vfxtool" runtask print-recommends)" \
            --notice mygo/assets/licenses.txt dist
      - name: Validate the packages
        run: |
          desktop-file-validate shared/packaging/linux/dev.vfox.VfoxPlus.desktop
          # CI packages carry a placeholder maintainer; releases set DEB_MAINTAINER.
          lintian --fail-on error --suppress-tags malformed-contact,bogus-mail-host-in-debian-changelog dist/*.deb
      - name: Install the .deb into a clean Ubuntu container
        # The application must start with nothing but the declared dependencies.
        run: |
          docker run --rm --init \
            --volume "$PWD/dist:/pkg:ro" \
            --volume "$RUNNER_TEMP/vfxtool:/vfxtool:ro" \
            ubuntu:26.04 /vfxtool runtask install-test
      - name: Cross-compile the Windows executables
        # mygo needs no C compiler, so the Windows builds run on Linux.
        run: |
          "$RUNNER_TEMP/vfxtool" build --goos windows --goarch amd64 --root mygo "$RUNNER_TEMP/stage-x64/vfox-plus.exe"
          "$RUNNER_TEMP/vfxtool" build --goos windows --goarch arm64 --root mygo "$RUNNER_TEMP/stage-arm64/vfox-plus.exe"
      - name: Build the unsigned .msix and .msixbundle
        run: |
          mkdir -p dist-windows
          # Reproducible timestamps in the package metadata.
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" "$RUNNER_TEMP/vfxtool" build-msix \
            --package vfox-plus --version "$(tr -d '[:space:]' < mygo/VERSION)" \
            --stage-x64 "$RUNNER_TEMP/stage-x64" --stage-arm64 "$RUNNER_TEMP/stage-arm64" \
            --executable vfox-plus.exe dist-windows
      - name: Stage the Windows self-sign inputs
        # Sign-Msix.ps1 rebuilds the packages with the self-signed publisher
        # and signs them on the user's machine, so the artifact carries the
        # loose executables, a Windows vfxtool and the script next to the
        # unsigned packages.
        run: |
          mkdir -p dist-windows/stage-x64 dist-windows/stage-arm64
          install -m 644 "$RUNNER_TEMP/stage-x64/vfox-plus.exe" dist-windows/stage-x64/vfox-plus.exe
          install -m 644 "$RUNNER_TEMP/stage-arm64/vfox-plus.exe" dist-windows/stage-arm64/vfox-plus.exe
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go -C shared/tooling build -o "$PWD/dist-windows/vfxtool.exe" ./cmd/vfxtool
          install -m 644 shared/packaging/windows/Sign-Msix.ps1 dist-windows/Sign-Msix.ps1
      - name: Validate the MSIX packages
        # Pure-Go validation without the Windows SDK (vfxtool validate-msix):
        # ZIP layout, manifests, block maps, bundle offsets, version
        # consistency and the self-sign inputs of the artifact.
        run: |
          ls -la dist-windows dist-windows/stage-x64 dist-windows/stage-arm64
          for f in dist-windows/stage-x64/vfox-plus.exe dist-windows/stage-arm64/vfox-plus.exe dist-windows/vfxtool.exe dist-windows/Sign-Msix.ps1; do
            test -f "$f" || { echo "missing self-sign input: $f"; exit 1; }
          done
          "$RUNNER_TEMP/vfxtool" validate-msix dist-windows
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vfox-plus-linux-x64
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vfox-plus-windows
          path: dist-windows/*
          if-no-files-found: error

  validate-windows:
    name: Validate and install the MSIX on Windows (${{ matrix.os }})
    # Forks do not run CI.
    if: github.repository == 'version-fox/vfox-plus'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            arch: x64
          - os: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    needs: [build]
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: vfox-plus-windows
          path: msix
      - name: Validate the bundle with PowerShell
        shell: pwsh
        run: |
          Get-ChildItem msix
          foreach ($want in @("stage-x64/vfox-plus.exe", "stage-arm64/vfox-plus.exe",
                              "vfxtool.exe", "Sign-Msix.ps1")) {
            if (-not (Test-Path "msix/$want")) { throw "msix/ misses $want" }
          }
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/msix/Sign-Msix.ps1", [ref]$null, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) {
            throw "Sign-Msix.ps1 has syntax errors: $($parseErrors | Select-Object -First 3)"
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $bundle = Get-ChildItem msix/*.msixbundle | Select-Object -First 1
          if (-not $bundle) { throw "no .msixbundle in msix/" }
          $zip = [System.IO.Compression.ZipFile]::OpenRead($bundle.FullName)
          try {
            $names = $zip.Entries | ForEach-Object { $_.FullName }
            foreach ($want in @("AppxMetadata/AppxBundleManifest.xml", "[Content_Types].xml", "AppxBlockMap.xml")) {
              if ($names -notcontains $want) { throw "$($bundle.Name) misses $want" }
            }
            $entry = $zip.GetEntry("AppxMetadata/AppxBundleManifest.xml")
            $reader = New-Object System.IO.StreamReader($entry.Open())
            try { [xml]$manifest = $reader.ReadToEnd() }
            finally { $reader.Close() }
            if (-not $manifest.Bundle.Identity.Name) { throw "bundle manifest has no identity" }
            $publisher = $manifest.Bundle.Identity.Publisher
            if ($publisher -notmatch "OID.2.25.311729368913984317654407730594956997722=1") {
              throw "unsigned bundle publisher misses the OID: $publisher"
            }
            $pkgs = $manifest.Bundle.Packages.Package
            $archs = $pkgs | ForEach-Object { $_.Architecture }
            if (($archs -notcontains "x64") -or ($archs -notcontains "arm64")) {
              throw "bundle must contain x64 and arm64, got $archs"
            }
            Write-Host "validated $($bundle.Name): $($pkgs.Count) packages, publisher $publisher"
          } finally {
            $zip.Dispose()
          }
          foreach ($msix in Get-ChildItem msix/*.msix) {
            $bytes = [System.IO.File]::ReadAllBytes($msix.FullName)
            if ($bytes[0] -ne 0x50 -or $bytes[1] -ne 0x4b) { throw "$($msix.Name) is not a ZIP" }
          }
      - name: Install and uninstall the bundle
        # UAC is disabled on GitHub-hosted runners, so the unsigned install
        # for all users runs without a prompt. The deployment platform picks
        # the slice matching this runner, which proves each architecture.
        shell: pwsh
        run: |
          $bundle = Get-ChildItem msix/*.msixbundle | Select-Object -First 1
          Add-AppxPackage -Path $bundle.FullName -AllowUnsigned
          $pkg = Get-AppxPackage -Name "dev.vfox.VfoxPlus"
          if (-not $pkg) { throw "package not registered after install" }
          if ("$($pkg.Architecture)" -ne "${{ matrix.arch }}") {
            throw "installed arch $($pkg.Architecture), want ${{ matrix.arch }}"
          }
          Write-Host "installed $($pkg.PackageFullName) arch $($pkg.Architecture)"
          Remove-AppxPackage -Package $pkg.PackageFullName
          if (Get-AppxPackage -Name "dev.vfox.VfoxPlus") { throw "package still registered after removal" }
          Write-Host "uninstalled cleanly"
