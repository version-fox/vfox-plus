# The application: formatting, golangci-lint and the unit tests (with
# coverage gates), the end-to-end scenarios that drive the built application
# (against captured output and against the real vfox, and its icon in the tray
# against a stand-in for the host of the tray icons on Linux, against the GNOME
# Shell of Ubuntu in a container, and against the taskbar on Windows), the Docker
# image of the gateway (built, and run against the application as the people who use
# it run it: it is not published), the Linux packages and the Windows MSIX bundle, and
# the census of the screens of the desktop in the text engine of each platform (Linux, Windows
# on x64 and on ARM, macOS).
# shared/tooling/internal/runtask runs the same steps locally; keep them in sync.
# The tool versions are in mygo/versions.env.
name: mygo

on:
  push:
    branches: [main]
    paths:
      - mygo/**
      - shared/**
      - .github/workflows/mygo.yml
  pull_request:
    paths:
      - mygo/**
      - shared/**
      - .github/workflows/mygo.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Packages needed to build and run mygo applications on Linux: nothing to
  # build with (mygo needs no C compiler, and only the race detector of the tests
  # needs one), GTK 3 to run, which mygo loads when it starts, and
  # libayatana-appindicator3, which it loads for the icon in the tray (without it the
  # application has no icon, and the scenario of the icon has nothing to test).
  # Fontconfig and the fonts are what the interface looks up.
  LINUX_PACKAGES: >-
    build-essential libgtk-3-0t64 libayatana-appindicator3-1 fontconfig fonts-ubuntu fonts-noto-cjk
    xvfb xauth dbus-x11 lintian desktop-file-utils

jobs:
  unit:
    name: Check and test with the race detector
    # The checks of the code and its unit tests, with the race detector, which the job that builds the application does not wait
    # for: the two take about as long as each other. Forks do not run CI.
    if: github.repository == 'version-fox/vfox-plus'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the pinned versions
        run: grep -hE '^[A-Z0-9_]+=' mygo/versions.env >> "$GITHUB_ENV"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: mygo/go.sum
      - name: Install the Linux packages
        uses: ./.github/actions/install-linux-packages
        with:
          packages: ${{ env.LINUX_PACKAGES }}
      - name: Install golangci-lint
        env:
          # Raises the API rate limit of the fallback in the script.
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="golangci-lint-$GOLANGCI_LINT_VERSION-linux-amd64"
          shared/scripts/download-release-asset.sh \
            golangci/golangci-lint "v$GOLANGCI_LINT_VERSION" "$archive.tar.gz" \
            "$RUNNER_TEMP/$archive.tar.gz" "$GOLANGCI_LINT_SHA256"
          tar -xzf "$RUNNER_TEMP/$archive.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$archive" >> "$GITHUB_PATH"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Where vfxtool prepare keeps the npm package that the icons come from.
          path: ~/.cache/vfox-plus/icons
          key: icons-${{ hashFiles('shared/icons.json') }}
      - name: Build vfxtool
        run: go -C shared/tooling build -o "$RUNNER_TEMP/vfxtool" ./cmd/vfxtool
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mygo/web/package-lock.json
      - name: Build and test the web interface
        # TypeScript and Vite, bundled into the single page that the Go server
        # embeds as mygo/pair/webapp.html (no other requests, desktop and web
        # stay on one design). The built page is committed: the check below
        # fails when the sources and the checked-in page disagree.
        working-directory: mygo/web
        run: |
          npm ci
          npm test
          npm run build
      - name: The built page is committed
        run: git diff --exit-code -- mygo/pair/webapp.html
      - name: Prepare the embedded assets
        # The icons, the translations and the licenses of the Go modules.
        run: '"$RUNNER_TEMP/vfxtool" prepare --root mygo'
      - name: Verify the modules
        working-directory: mygo
        run: go mod verify
      - name: Check formatting
        working-directory: mygo
        run: golangci-lint fmt --diff
      - name: Lint
        working-directory: mygo
        run: |
          golangci-lint run
          golangci-lint run --build-tags e2e
      - name: Test
        working-directory: mygo
        run: |
          go vet ./...
          # The race detector needs cgo; the application is built without it. The census of the screens is taken by the
          # job that builds the application, without it: the census does not need the race detector, which makes it three
          # times slower. The race run has half an hour: on the runners, the tests of the package of the screens ran past
          # the default of ten minutes with the race detector (the run at ff4d63d stopped them there), where a machine of
          # ours takes seven.
          CGO_ENABLED=1 go test -race -timeout 30m -coverprofile=coverage.out ./...
          "$RUNNER_TEMP/vfxtool" coverage coverage.out 85
      - name: Test vfxtool
        run: |
          go -C shared/tooling vet ./...
          go -C shared/tooling test ./...

  build:
    name: Take the census, test end to end and package
    # Forks do not run CI.
    if: github.repository == 'version-fox/vfox-plus'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the pinned versions
        run: grep -hE '^[A-Z0-9_]+=' mygo/versions.env >> "$GITHUB_ENV"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: mygo/go.sum
      - name: Install the Linux packages
        uses: ./.github/actions/install-linux-packages
        with:
          packages: ${{ env.LINUX_PACKAGES }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Where vfxtool prepare keeps the npm package that the icons come from.
          path: ~/.cache/vfox-plus/icons
          key: icons-${{ hashFiles('shared/icons.json') }}
      - name: Build vfxtool
        run: go -C shared/tooling build -o "$RUNNER_TEMP/vfxtool" ./cmd/vfxtool
      - name: Prepare the embedded assets
        # The icons, the translations and the licenses of the Go modules.
        run: '"$RUNNER_TEMP/vfxtool" prepare --root mygo'
      - name: Build the release
        run: '"$RUNNER_TEMP/vfxtool" build --root mygo mygo/build/vfox-plus'
      - name: Take the census of the screens
        # The census of the screens, which the job that checks and tests the code leaves out: it does not need the race
        # detector, which makes it three times slower. It takes the screens in the fonts that the runner has with the
        # packages above; the census of the matrix takes the screens of Linux again, with the fonts that the desktops of
        # Linux set their text in installed.
        working-directory: mygo
        run: go test ./ui -run TestTheScreensAreWithinTheBudgets -count=1
      - name: Install vfox
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="vfox_${VFOX_VERSION}_linux_x86_64"
          shared/scripts/download-release-asset.sh \
            version-fox/vfox "v$VFOX_VERSION" "$archive.tar.gz" \
            "$RUNNER_TEMP/$archive.tar.gz" "$VFOX_SHA256"
          tar -xzf "$RUNNER_TEMP/$archive.tar.gz" -C "$RUNNER_TEMP"
          echo "VFOX_PLUS_E2E_VFOX=$RUNNER_TEMP/$archive/vfox" >> "$GITHUB_ENV"
      - name: Run the end-to-end scenarios in a virtual display
        env:
          # `vfxtool measure` writes its numbers here for memory.yml.
          VFOX_PLUS_MEASURE_OUTPUT: ${{ runner.temp }}/memory/memory.txt
        run: |
          "$RUNNER_TEMP/vfxtool" build --e2e --root mygo "$RUNNER_TEMP/vfox-plus-e2e"
          # tray: the icon in the tray, against the stand-in for the host of the tray icons that
          # vfxtool makes: a runner has no panel.
          for scenario in fake real tray; do
            xvfb-run -a -s "-screen 0 1280x800x24" dbus-run-session -- \
              "$RUNNER_TEMP/vfxtool" e2e-run "$scenario" "$RUNNER_TEMP/vfox-plus-e2e"
          done
          xvfb-run -a -s "-screen 0 1280x800x24" dbus-run-session -- \
            "$RUNNER_TEMP/vfxtool" measure "$RUNNER_TEMP/vfox-plus-e2e"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: memory-mygo
          path: ${{ runner.temp }}/memory/memory.txt
          if-no-files-found: error
          overwrite: true
      - name: Smoke test the release
        run: '"$RUNNER_TEMP/vfxtool" smoke-test --log app.log mygo/build/vfox-plus'
      - name: Build the .deb and the tarball
        run: |
          install -D -m 755 mygo/build/vfox-plus "$RUNNER_TEMP/stage/vfox-plus"
          # Reproducible timestamps in the package metadata.
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" "$RUNNER_TEMP/vfxtool" build-deb \
            --package vfox-plus --version "$(tr -d '[:space:]' < mygo/VERSION)" \
            --stage "$RUNNER_TEMP/stage" --executable vfox-plus --technology mygo \
            --depends "$("$RUNNER_TEMP/vfxtool" runtask print-depends)" \
            --recommends "$("$RUNNER_TEMP/vfxtool" runtask print-recommends)" \
            --notice mygo/assets/licenses.txt dist
      - name: Validate the packages
        run: |
          desktop-file-validate shared/packaging/linux/dev.vfox.VfoxPlus.desktop
          # CI packages carry a placeholder maintainer; releases set DEB_MAINTAINER.
          lintian --fail-on error --suppress-tags malformed-contact,bogus-mail-host-in-debian-changelog dist/*.deb
      - name: Install the .deb into a clean Ubuntu container
        # The application must start with nothing but the declared dependencies.
        run: |
          docker run --rm --init \
            --volume "$PWD/dist:/pkg:ro" \
            --volume "$RUNNER_TEMP/vfxtool:/vfxtool:ro" \
            ubuntu:26.04 /vfxtool runtask install-test
      - name: Cross-compile the Windows executables
        # mygo needs no C compiler, so the Windows builds run on Linux.
        run: |
          "$RUNNER_TEMP/vfxtool" build --goos windows --goarch amd64 --root mygo "$RUNNER_TEMP/stage-x64/vfox-plus.exe"
          "$RUNNER_TEMP/vfxtool" build --goos windows --goarch arm64 --root mygo "$RUNNER_TEMP/stage-arm64/vfox-plus.exe"
      - name: Cross-compile the end-to-end builds for the run on Windows
        # The scenarios drive the build with the tag e2e, which a release does not have, and
        # vfxtool both runs them and stands in for vfox; the Windows runners below use them.
        run: |
          for arch in amd64 arm64; do
            dir="$RUNNER_TEMP/windows-e2e/$arch"
            "$RUNNER_TEMP/vfxtool" build --e2e --goos windows --goarch "$arch" --root mygo "$dir/vfox-plus-e2e.exe"
            GOOS=windows GOARCH="$arch" CGO_ENABLED=0 go -C shared/tooling build -o "$dir/vfxtool.exe" ./cmd/vfxtool
          done
      - name: Build the unsigned .msix and .msixbundle
        run: |
          mkdir -p dist-windows
          # Reproducible timestamps in the package metadata.
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" "$RUNNER_TEMP/vfxtool" build-msix \
            --package vfox-plus --version "$(tr -d '[:space:]' < mygo/VERSION)" \
            --stage-x64 "$RUNNER_TEMP/stage-x64" --stage-arm64 "$RUNNER_TEMP/stage-arm64" \
            --executable vfox-plus.exe dist-windows
      - name: Stage the Windows self-sign inputs
        # `vfxtool sign-msix` rebuilds the packages with the self-signed
        # publisher and signs them on the user's machine, so the artifact
        # carries the loose executables and a Windows vfxtool next to the
        # unsigned packages.
        run: |
          mkdir -p dist-windows/stage-x64 dist-windows/stage-arm64
          install -m 644 "$RUNNER_TEMP/stage-x64/vfox-plus.exe" dist-windows/stage-x64/vfox-plus.exe
          install -m 644 "$RUNNER_TEMP/stage-arm64/vfox-plus.exe" dist-windows/stage-arm64/vfox-plus.exe
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go -C shared/tooling build -o "$PWD/dist-windows/vfxtool.exe" ./cmd/vfxtool
      - name: Validate the MSIX packages
        # Pure-Go validation without the Windows SDK (vfxtool validate-msix):
        # ZIP layout, manifests, block maps, bundle offsets, version
        # consistency and the self-sign inputs of the artifact.
        run: |
          ls -la dist-windows dist-windows/stage-x64 dist-windows/stage-arm64
          for f in dist-windows/stage-x64/vfox-plus.exe dist-windows/stage-arm64/vfox-plus.exe dist-windows/vfxtool.exe; do
            test -f "$f" || { echo "missing self-sign input: $f"; exit 1; }
          done
          "$RUNNER_TEMP/vfxtool" validate-msix dist-windows
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vfox-plus-linux-x64
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vfox-plus-windows
          path: dist-windows/*
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vfox-plus-windows-e2e
          path: ${{ runner.temp }}/windows-e2e/*
          if-no-files-found: error

  measure-remote:
    name: Measure the lightweight mode
    # Forks do not run CI.
    if: github.repository == 'version-fox/vfox-plus'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the pinned versions
        run: grep -hE '^[A-Z0-9_]+=' mygo/versions.env >> "$GITHUB_ENV"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            mygo/go.sum
            shared/tooling/go.sum
      - name: Install the Linux packages
        # The application is a desktop application: it needs GTK 3 and a display, which
        # the virtual one of xvfb gives, even to have its web interface served.
        uses: ./.github/actions/install-linux-packages
        with:
          packages: libgtk-3-0t64 libayatana-appindicator3-1 fontconfig fonts-ubuntu fonts-noto-cjk xvfb xauth dbus-x11
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Where vfxtool prepare keeps the npm package that the icons come from.
          path: ~/.cache/vfox-plus/icons
          key: icons-${{ hashFiles('shared/icons.json') }}
      - name: Build vfxtool and the application
        run: |
          go -C shared/tooling build -o "$RUNNER_TEMP/vfxtool" ./cmd/vfxtool
          "$RUNNER_TEMP/vfxtool" prepare --root mygo
          "$RUNNER_TEMP/vfxtool" build --e2e --root mygo "$RUNNER_TEMP/vfox-plus-e2e"
      - name: Measure the lightweight mode
        env:
          VFOX_PLUS_MEASURE_OUTPUT: ${{ runner.temp }}/memory-lightweight/memory.txt
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24" dbus-run-session -- \
            "$RUNNER_TEMP/vfxtool" measure-lightweight --settle 10 "$RUNNER_TEMP/vfox-plus-e2e"
          cat "${{ runner.temp }}/memory-lightweight/memory.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: memory-lightweight
          path: ${{ runner.temp }}/memory-lightweight/memory.txt
          if-no-files-found: error
          overwrite: true
      - name: Check what the icon in the tray costs
        # After the numbers are uploaded, so that a failure here leaves the report whole. A runner has no
        # panel, so vfxtool stands in for the host of the tray icons, as it does in the scenario of the
        # icon; the application is run without it and with it, in the same way, and fails the job when
        # the icon costs more than 5 MB of resident memory or 1.5 MB of private memory: it costs
        # 0.4 MB and 0.08 MB, and 7 MB and 1.8 MB where nothing shows the icon and the library falls
        # back to an icon of the old kind.
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24" dbus-run-session -- \
            "$RUNNER_TEMP/vfxtool" measure-lightweight --tray --settle 10 "$RUNNER_TEMP/vfox-plus-e2e"
  validate-windows:
    name: Validate and install the MSIX on Windows (${{ matrix.os }})
    # Forks do not run CI.
    if: github.repository == 'version-fox/vfox-plus'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            arch: x64
          - os: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    needs: [unit, build]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vfox-plus-windows
          path: msix
      - name: Validate the bundle with PowerShell
        shell: pwsh
        run: |
          Get-ChildItem msix
          foreach ($want in @("stage-x64/vfox-plus.exe", "stage-arm64/vfox-plus.exe", "vfxtool.exe")) {
            if (-not (Test-Path "msix/$want")) { throw "msix/ misses $want" }
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $bundle = Get-ChildItem msix/*.msixbundle | Select-Object -First 1
          if (-not $bundle) { throw "no .msixbundle in msix/" }
          $zip = [System.IO.Compression.ZipFile]::OpenRead($bundle.FullName)
          try {
            $names = $zip.Entries | ForEach-Object { $_.FullName }
            foreach ($want in @("AppxMetadata/AppxBundleManifest.xml", "[Content_Types].xml", "AppxBlockMap.xml")) {
              if ($names -notcontains $want) { throw "$($bundle.Name) misses $want" }
            }
            $entry = $zip.GetEntry("AppxMetadata/AppxBundleManifest.xml")
            $reader = New-Object System.IO.StreamReader($entry.Open())
            try { [xml]$manifest = $reader.ReadToEnd() }
            finally { $reader.Close() }
            if (-not $manifest.Bundle.Identity.Name) { throw "bundle manifest has no identity" }
            $publisher = $manifest.Bundle.Identity.Publisher
            if ($publisher -notmatch "OID.2.25.311729368913984317654407730594956997722=1") {
              throw "unsigned bundle publisher misses the OID: $publisher"
            }
            $pkgs = $manifest.Bundle.Packages.Package
            $archs = $pkgs | ForEach-Object { $_.Architecture }
            if (($archs -notcontains "x64") -or ($archs -notcontains "arm64")) {
              throw "bundle must contain x64 and arm64, got $archs"
            }
            Write-Host "validated $($bundle.Name): $($pkgs.Count) packages, publisher $publisher"
          } finally {
            $zip.Dispose()
          }
          foreach ($msix in Get-ChildItem msix/*.msix) {
            $bytes = [System.IO.File]::ReadAllBytes($msix.FullName)
            if ($bytes[0] -ne 0x50 -or $bytes[1] -ne 0x4b) { throw "$($msix.Name) is not a ZIP" }
          }
      - name: Install and uninstall the bundle
        # UAC is disabled on GitHub-hosted runners, so the unsigned install
        # for all users runs without a prompt. The deployment platform picks
        # the slice matching this runner, which proves each architecture.
        # On failure the AppX deployment log pinpoints the failing check.
        shell: pwsh
        run: |
          $bundle = Get-ChildItem msix/*.msixbundle | Select-Object -First 1
          try {
            Add-AppxPackage -Path $bundle.FullName -AllowUnsigned
          } catch {
            Write-Host "--- AppX deployment log (tail) ---"
            Get-AppPackageLog | Select-Object -Last 60
            throw
          }
          $pkg = Get-AppxPackage -Name "dev.vfox.VfoxPlus"
          if (-not $pkg) { throw "package not registered after install" }
          if ("$($pkg.Architecture)" -ne "${{ matrix.arch }}") {
            throw "installed arch $($pkg.Architecture), want ${{ matrix.arch }}"
          }
          Write-Host "installed $($pkg.PackageFullName) arch $($pkg.Architecture)"
          Remove-AppxPackage -Package $pkg.PackageFullName
          if (Get-AppxPackage -Name "dev.vfox.VfoxPlus") { throw "package still registered after removal" }
          Write-Host "uninstalled cleanly"
      - name: Sign, install and uninstall the bundle with vfxtool sign-msix
        # What a user runs on a Windows machine: sign-msix rebuilds the
        # packages with the publisher of a certificate that it makes, signs them
        # with the pinned osslsigncode that it downloads, trusts the certificate
        # for the machine and installs the bundle without -AllowUnsigned (the
        # deployment platform checks the signature and the trust). A second run
        # must replace the certificate of the first, not add another. The runner
        # is an administrator with UAC off, so there is no elevated copy (-no-relaunch
        # makes it fail instead of waiting for a prompt that nobody answers).
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $subject = "CN=vfox-plus"
          function Get-SigningCertificates {
            @(Get-ChildItem Cert:\LocalMachine\TrustedPeople | Where-Object { $_.Subject -eq $subject })
          }
          if ((Get-SigningCertificates).Count -ne 0) { throw "the runner trusts $subject already" }

          & msix/vfxtool.exe sign-msix --directory msix --no-relaunch
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            # The deployment log says that the package could not be opened;
            # the packaging log says why (a signature, a block map, a manifest).
            Write-Host "--- AppX deployment log (tail) ---"
            Get-AppPackageLog | Select-Object -Last 60
            Write-Host "--- AppxPackaging log (tail) ---"
            Get-WinEvent -LogName "Microsoft-Windows-AppxPackaging/Operational" -MaxEvents 20 -ErrorAction SilentlyContinue |
              Format-List TimeCreated, Id, Message
            # Whether the signed package of this machine installs alone tells a
            # fault of the package from one of the bundle.
            Write-Host "--- the signed package of this machine, alone ---"
            Get-ChildItem msix/signed | Format-Table Name, Length
            $alone = Get-ChildItem "msix/signed/*_${{ matrix.arch }}.msix" | Select-Object -First 1
            try {
              Add-AppxPackage -Path $alone.FullName
              Write-Host "$($alone.Name) installs"
              Get-AppxPackage -Name "dev.vfox.VfoxPlus" | Remove-AppxPackage
            } catch {
              Write-Host "$($alone.Name) does not install: $_"
            }
            # The end of a package shows whether the ZIP64 records are there (the
            # ZIP64 end record, its locator and the end record: 98 bytes). The
            # tools of the Windows SDK, which the runner has, check the package
            # with the code of Windows and name what is wrong with it.
            Write-Host "--- the last 98 bytes of $($alone.Name) ---"
            $bytes = [System.IO.File]::ReadAllBytes($alone.FullName)
            ($bytes[($bytes.Length - 98)..($bytes.Length - 1)] | ForEach-Object { $_.ToString("x2") }) -join " "
            $kits = Join-Path ${env:ProgramFiles(x86)} "Windows Kits\10\bin"
            foreach ($name in "signtool.exe", "makeappx.exe") {
              $tool = Get-ChildItem $kits -Recurse -Filter $name -ErrorAction SilentlyContinue |
                Where-Object { $_.FullName -match "\\(x64|arm64)\\" } |
                Sort-Object FullName | Select-Object -Last 1
              if (-not $tool) { Write-Host "--- $name is not on this runner ---"; continue }
              Write-Host "--- $($tool.FullName) on $($alone.Name) ---"
              if ($name -eq "signtool.exe") {
                & $tool.FullName verify /pa /v $alone.FullName
              } else {
                & $tool.FullName unpack /p $alone.FullName /d (Join-Path $env:RUNNER_TEMP "unpacked") /o /v
              }
              Write-Host "exit code $LASTEXITCODE"
            }
            throw "sign-msix failed with exit code $code"
          }
          $pkg = Get-AppxPackage -Name "dev.vfox.VfoxPlus"
          if (-not $pkg) { throw "package not registered after the signed install" }
          if ("$($pkg.Architecture)" -ne "${{ matrix.arch }}") {
            throw "installed arch $($pkg.Architecture), want ${{ matrix.arch }}"
          }
          Write-Host "installed $($pkg.PackageFullName) arch $($pkg.Architecture), signature $($pkg.SignatureKind)"
          if ((Get-SigningCertificates).Count -ne 1) { throw "want one trusted $subject, got $((Get-SigningCertificates).Count)" }
          Remove-AppxPackage -Package $pkg.PackageFullName
          if (Get-AppxPackage -Name "dev.vfox.VfoxPlus") { throw "package still registered after removal" }

          & msix/vfxtool.exe sign-msix --directory msix --no-relaunch --skip-install
          if ($LASTEXITCODE -ne 0) { throw "the second sign-msix failed with exit code $LASTEXITCODE" }
          $found = Get-SigningCertificates
          if ($found.Count -ne 1) { throw "want one trusted $subject after two runs, got $($found.Count)" }
          foreach ($certificate in $found) {
            Remove-Item -Path "Cert:\LocalMachine\TrustedPeople\$($certificate.Thumbprint)"
          }
          Write-Host "signed, installed and uninstalled cleanly"

  tray-gnome:
    name: Run the icon in the tray on GNOME
    # Forks do not run CI.
    if: github.repository == 'version-fox/vfox-plus'
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the pinned versions
        run: grep -hE '^[A-Z0-9_]+=' mygo/versions.env >> "$GITHUB_ENV"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            mygo/go.sum
            shared/tooling/go.sum
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Where vfxtool prepare keeps the npm package that the icons come from.
          path: ~/.cache/vfox-plus/icons
          key: icons-${{ hashFiles('shared/icons.json') }}
      - name: Build vfxtool and the end-to-end build of the application
        # No package of the runner is needed: the application is built without a C compiler, and it
        # runs in the container below, which has what it loads.
        run: |
          go -C shared/tooling build -o "$RUNNER_TEMP/vfxtool" ./cmd/vfxtool
          "$RUNNER_TEMP/vfxtool" prepare --root mygo
          "$RUNNER_TEMP/vfxtool" build --e2e --root mygo "$RUNNER_TEMP/vfox-plus-e2e"
      - name: Build the image of a GNOME Shell with no screen
        # Ubuntu's GNOME Shell and its AppIndicator extension, the library of the icon, and an
        # ordinary user (shared/sandbox/gnome.Dockerfile).
        run: docker build --tag vfox-plus-gnome --file shared/sandbox/gnome.Dockerfile shared/sandbox
      - name: Run the icon in the tray on the shell
        # vfxtool gnome-session starts the shell and its extension inside the container, as root
        # (it makes the system bus that the shell wants) and then as the user of the session, and runs the
        # scenario on the display of the shell: the application closes its window, the shell puts its icon
        # in its panel and makes the menu of it, chooses its entries as the user does, and the application
        # does what they say. The repository is mounted for the captured output of vfox that the scenario uses.
        run: |
          docker run --rm --init \
            --volume "$PWD:/repo:ro" \
            --volume "$RUNNER_TEMP/vfxtool:/usr/local/bin/vfxtool:ro" \
            --volume "$RUNNER_TEMP/vfox-plus-e2e:/usr/local/bin/vfox-plus-e2e:ro" \
            --workdir /repo \
            vfox-plus-gnome \
            vfxtool gnome-session vfxtool e2e-run tray-gnome /usr/local/bin/vfox-plus-e2e

  gateway:
    name: Run the image of the gateway against the application
    # Forks do not run CI.
    if: github.repository == 'version-fox/vfox-plus'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the pinned versions
        run: grep -hE '^[A-Z0-9_]+=' mygo/versions.env >> "$GITHUB_ENV"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            mygo/go.sum
            shared/tooling/go.sum
      - name: Install the Linux packages
        # The application is a desktop application: it needs GTK 3 and a display, which the virtual one
        # of xvfb gives, even to have its web interface served. The gateway is not: it is the image.
        uses: ./.github/actions/install-linux-packages
        with:
          packages: libgtk-3-0t64 libayatana-appindicator3-1 fontconfig fonts-ubuntu fonts-noto-cjk xvfb xauth dbus-x11
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Where vfxtool prepare keeps the npm package that the icons come from.
          path: ~/.cache/vfox-plus/icons
          key: icons-${{ hashFiles('shared/icons.json') }}
      - name: Build vfxtool and the end-to-end build of the application
        run: |
          go -C shared/tooling build -o "$RUNNER_TEMP/vfxtool" ./cmd/vfxtool
          "$RUNNER_TEMP/vfxtool" prepare --root mygo
          "$RUNNER_TEMP/vfxtool" build --e2e --root mygo "$RUNNER_TEMP/vfox-plus-e2e"
      - name: Build the image of the gateway
        # With the defaults of the Dockerfile, which are what the people who build it get: they have to be
        # the versions pinned in mygo/versions.env.
        run: |
          grep -Fx "ARG GO_VERSION=$GO_VERSION" mygo/Dockerfile
          grep -Fx "ARG GO_SHA256=$GO_SHA256" mygo/Dockerfile
          docker build --tag vfox-plus-gateway --file mygo/Dockerfile mygo
      - name: Run the gateway against the application
        # vfxtool gateway-check starts the application with its web interface and other devices switched on,
        # runs the image as a container with a volume of its own, and does what a person does at a browser:
        # pairs it with the link in the log of the container, pastes a link of the application, compares the
        # fingerprint of the certificate and uses the application through the gateway. It stops the container
        # with docker stop while the interface is open, starts it again, and ends the application.
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24" dbus-run-session -- \
            "$RUNNER_TEMP/vfxtool" gateway-check --image vfox-plus-gateway "$RUNNER_TEMP/vfox-plus-e2e"

  run-windows:
    name: Run the application on Windows (${{ matrix.os }})
    # Forks do not run CI.
    if: github.repository == 'version-fox/vfox-plus'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            arch: amd64
          - os: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    needs: [unit, build]
    steps:
      # The scenarios find the captured output of vfox in the repository.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: vfox-plus-windows-e2e
          path: e2e
      - name: Run the application against the fake vfox
        # The window of the application is drawn on the desktop of the runner and driven through
        # the automation plugin of mygo, as on Linux: the Home page, the versions of Node.js, using
        # one and installing another. vfxtool.exe is the fake vfox of the scenario, too.
        shell: pwsh
        run: |
          $dir = Join-Path $PWD "e2e/${{ matrix.arch }}"
          & "$dir/vfxtool.exe" e2e-run fake "$dir/vfox-plus-e2e.exe"
          if ($LASTEXITCODE -ne 0) { throw "the fake scenario failed with exit code $LASTEXITCODE" }
      - name: Run the icon in the tray
        # The application closes its window in the lightweight mode and runs on; the notification
        # area of the taskbar of the runner has to give its icon a place, the window comes back, and
        # the application ends as the menu of the icon asks.
        shell: pwsh
        run: |
          $dir = Join-Path $PWD "e2e/${{ matrix.arch }}"
          & "$dir/vfxtool.exe" e2e-run tray "$dir/vfox-plus-e2e.exe"
          if ($LASTEXITCODE -ne 0) { throw "the tray scenario failed with exit code $LASTEXITCODE" }

  census:
    name: Take the census of the screens (${{ matrix.os }}, ${{ matrix.group }})
    # What holds text is as wide as the text, which a platform sets in its own engine and fonts (Pango on Linux,
    # DirectWrite on Windows, Core Text on macOS), and a version of a platform has its own: each draws every screen and
    # holds it to the budgets of the design system, in English and in Chinese, at every size of text that the sweep
    # names, in the widest fonts that the machine has, and in a text made wider than any font. The census of the newest
    # Ubuntu is a step of the job build;
    # here it takes the rest, with the fonts that the desktops of Linux set their text in installed, and the others
    # take it all. Of Windows and of macOS the newest and the oldest that GitHub has are taken (windows-2022 is Windows
    # Server 2022, macos-15 is macOS 15), and the other architecture of each: windows-11-arm, and macos-15-intel.
    #
    # The tests are four jobs on each machine, not one, and a run of the census is as long as the longest of them, not as long
    # as their sum: the screens (the census, the fonts of the system and the wider text), the widest fonts, and the sweep of the
    # sizes of text in two jobs, the windows of 1280 dp, which take half of the sweep, and the others. A machine runs them at once.
    # Forks do not run CI.
    if: github.repository == 'version-fox/vfox-plus'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-2025, windows-2022, windows-11-arm, macos-latest, macos-15, macos-15-intel]
        group: [census, widest, sweep-wide, sweep-rest]
        include:
          - group: census
            run: 'TestTheScreensAreWithinTheBudgets$|TestTheScreensAreWithinTheBudgetsInTheFontsThatTheSystemChooses|TestTheScreensAreWithinTheBudgetsInATextThatIsWider'
          - group: widest
            run: 'TestTheScreensAreWithinTheBudgetsInTheWidestFontsThatTheSystemHas'
          - group: sweep-wide
            run: 'TestTheScreensAreWithinTheBudgetsAtEverySizeOfText/\.wide-'
          - group: sweep-rest
            run: 'TestTheScreensAreWithinTheBudgetsAtEverySizeOfText/\.(narrow|compact|medium)-'
          - os: ubuntu-26.04
            fonts: >-
              fonts-adwaita-sans fonts-cantarell fonts-noto-core fonts-inter fonts-open-sans fonts-roboto fonts-lato
              fonts-liberation2 fonts-freefont-ttf
    runs-on: ${{ matrix.os }}
    # The slowest of the machines, macOS 15 on Intel, took 44 minutes for all of the tests on the run at da7d186, before the sweep was
    # split in two. The tests of a group have 65 minutes, and the job an hour and a quarter.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the pinned versions
        shell: bash
        run: grep -hE '^[A-Z0-9_]+=' mygo/versions.env >> "$GITHUB_ENV"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            mygo/go.sum
            shared/tooling/go.sum
      - name: Install the Linux packages
        # The fonts that the desktops of Linux set their text in are installed beside the ones of the application: the
        # census takes the widest of the fonts that a machine has.
        if: runner.os == 'Linux'
        uses: ./.github/actions/install-linux-packages
        with:
          packages: ${{ env.LINUX_PACKAGES }} ${{ matrix.fonts }}
      - name: Show the system
        # What a run is of, in its log: the version of the system that its text engine and its fonts are those of.
        shell: bash
        run: |
          uname -srm
          if [ "$RUNNER_OS" = Linux ]; then . /etc/os-release && echo "$PRETTY_NAME"; fi
          if [ "$RUNNER_OS" = macOS ]; then sw_vers; fi
          if [ "$RUNNER_OS" = Windows ]; then cmd //c ver; fi
      - name: Prepare the embedded assets
        # The icons and the translations: the licenses of the modules are not what a census reads.
        id: prepare
        shell: bash
        env:
          MYGO_SKIP_LICENSES: '1'
        run: go -C shared/tooling run ./cmd/vfxtool prepare --root "$GITHUB_WORKSPACE/mygo"
      - name: Take the census
        # The screens of the census, in the fonts that the platform gives for sans-serif and monospace and in the widest that
        # the machine has, in a text made wider than any font, and the sizes of text between the ones of the census, in
        # English and in Chinese. The log has the census of each screen.
        working-directory: mygo
        shell: bash
        env:
          VFOX_PLUS_CENSUS_SWEEP: '1'
          VFOX_PLUS_CENSUS: ${{ runner.temp }}/census
          # Every picture of the screens is kept only by a run that is asked for by hand; a screen that is over a budget keeps its
          # picture in the census directory, which the last step uploads when the run fails.
          VFOX_PLUS_SNAPSHOTS: ${{ github.event_name == 'workflow_dispatch' && format('{0}/census', runner.temp) || '' }}
          TESTS: ${{ matrix.run }}
        run: |
          go test ./ui -run "$TESTS" -count=1 -timeout 65m -v 2>&1 | tee "$RUNNER_TEMP/census-output.txt"
          # A pattern that matches no test, or no subtest of the tests that it matches, passes without a screen: a group that
          # runs no screen has not taken the census.
          if ! grep -q -- '=== RUN .*/' "$RUNNER_TEMP/census-output.txt"; then
            echo "the pattern of the group runs no screen: $TESTS"
            exit 1
          fi
      - name: Test the kit
        # The components measure the text and wrap by what they measure, whatever it is set in: what their tests hold is the
        # same on every platform. It runs when the census did not pass, too, so that a run says both.
        if: ${{ !cancelled() && steps.prepare.conclusion == 'success' }}
        working-directory: mygo
        shell: bash
        run: go test ./ui/kit -count=1
      - name: Keep the pictures of the screens
        # When a screen is over a budget, to look at it; and when a run is asked for by hand.
        if: failure() || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: census-${{ matrix.os }}-${{ matrix.group }}
          path: ${{ runner.temp }}/census
          retention-days: 7
          if-no-files-found: ignore
