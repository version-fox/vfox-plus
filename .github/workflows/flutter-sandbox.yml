# The Docker sandbox of the Flutter implementation (flutter/sandbox): builds
# its image and runs every check in it whenever the sandbox or the pinned tool
# versions change, so that it keeps working for contributors.
name: Flutter sandbox

on:
  push:
    branches: [main]
    paths:
      - flutter/sandbox/**
      - flutter/versions.env
      - .github/workflows/flutter-sandbox.yml
  pull_request:
    paths:
      - flutter/sandbox/**
      - flutter/versions.env
      - .github/workflows/flutter-sandbox.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sandbox:
    name: Check, test and package in the sandbox
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run the sandbox
        run: flutter/sandbox/sandbox.sh all
