# The Android remote client: build the unsigned release APK and upload it as
# the `vfox-plus-android` artifact. The tool versions are in
# android/versions.env.
name: android

on:
  push:
    branches: [main]
    paths:
      - android/**
      - mygo/pair/**
      - mygo/VERSION
      - .github/workflows/android.yml
  pull_request:
    paths:
      - android/**
      - mygo/pair/**
      - mygo/VERSION
      - .github/workflows/android.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the APK
    # Forks do not run CI.
    if: github.repository == 'version-fox/vfox-plus'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the pinned versions
        run: grep -hE '^[A-Z0-9_]+=' android/versions.env >> "$GITHUB_ENV"
      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Set up the Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - name: Build the unsigned release APK
        run: gradle :app:assembleRelease
        working-directory: android
      - name: Name the APK with the version
        run: |
          version="$(tr -d '[:space:]' < mygo/VERSION)"
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk \
            "vfox-plus_${version}.apk"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vfox-plus-android
          path: vfox-plus_*.apk
  measure:
    name: Measure the APK on an emulator
    # Forks do not run CI.
    if: github.repository == 'version-fox/vfox-plus'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: vfox-plus-android
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: |
            PKG="$(sed -n 's/.*applicationId = "\([^"]*\)".*/\1/p' android/app/build.gradle.kts | head -1)"
            [ -n "$PKG" ] || { echo "no applicationId in android/app/build.gradle.kts"; exit 1; }
            adb install apk/*.apk
            # Cold start through the launcher, like a user tapping the icon.
            adb shell monkey -p "$PKG" -c android.intent.category.LAUNCHER 1
            sleep 20
            DUMP="$(adb shell dumpsys meminfo "$PKG")"
            PSS_KB="$(echo "$DUMP" | awk '/^ *TOTAL +[0-9]/{print $2; exit}')"
            RSS_KB="$(echo "$DUMP" | awk '{for (i = 1; i <= NF; i++) if ($i == "RSS:") {v = $(i+1); sub(/K$/, "", v); print v; exit}}')"
            [ -n "$PSS_KB" ] && [ -n "$RSS_KB" ] || { echo "$DUMP"; exit 1; }
            mkdir -p "$RUNNER_TEMP/memory-android"
            printf 'memory (apk-cold): RSS %d MB, PSS %d MB in 1 processes\n' \
              "$(( (RSS_KB + 512) / 1024 ))" "$(( (PSS_KB + 512) / 1024 ))" \
              | tee "$RUNNER_TEMP/memory-android/memory.txt"
            # A screenshot of the cold start, for the documentation.
            adb exec-out screencap -p > "$RUNNER_TEMP/screenshot-android.png"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: memory-android
          path: ${{ runner.temp }}/memory-android/memory.txt
          if-no-files-found: error
          overwrite: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshot-android
          path: ${{ runner.temp }}/screenshot-android.png
          if-no-files-found: error
          overwrite: true
