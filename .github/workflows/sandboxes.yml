# The Docker sandbox that builds on shared/sandbox: whenever the sandbox, its
# pinned versions or the shared parts change, builds the image of the mygo
# implementation and runs `sandbox.sh all` in it, so that the sandbox keeps
# working for contributors.
name: Sandboxes

on:
  push:
    branches: [main]
    paths:
      - "mygo/sandbox/**"
      - "mygo/versions.env"
      - shared/sandbox/**
      - shared/tools/**
      - shared/e2e/**
      - .github/workflows/sandboxes.yml
  pull_request:
    paths:
      - "mygo/sandbox/**"
      - "mygo/versions.env"
      - shared/sandbox/**
      - shared/tools/**
      - shared/e2e/**
      - .github/workflows/sandboxes.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sandbox:
    name: mygo
    # Forks do not run CI.
    if: github.repository == 'version-fox/vfox-plus'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run the sandbox
        run: mygo/sandbox/sandbox.sh all
