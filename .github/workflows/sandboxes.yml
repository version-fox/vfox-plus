# The Docker sandbox that builds on shared/sandbox: whenever the sandbox, its
# pinned versions or the shared parts change, builds the image of the mygo
# implementation and runs its parts in it, so that the sandbox keeps working for
# contributors. Each part is a job of its own, which builds the image itself
# (about two minutes), and the parts run at once: a run takes as long as the
# longest of them.
name: Sandboxes

on:
  push:
    branches: [main]
    paths:
      - "mygo/sandbox/**"
      - "mygo/versions.env"
      - shared/sandbox/**
      - shared/tooling/**
      - .github/workflows/sandboxes.yml
  pull_request:
    paths:
      - "mygo/sandbox/**"
      - "mygo/versions.env"
      - shared/sandbox/**
      - shared/tooling/**
      - .github/workflows/sandboxes.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sandbox:
    name: mygo (${{ matrix.part }})
    # Forks do not run CI.
    if: github.repository == 'version-fox/vfox-plus'
    strategy:
      fail-fast: false
      matrix:
        # The parts of `vfxtool sandbox all`: the checks, the end-to-end scenarios, the packages and the four groups of the census of
        # the screens, which mygo.yml takes in the same groups.
        include:
          - part: check
            command: check
          - part: e2e
            command: e2e
          - part: package
            command: package
          - part: census
            command: census census
          - part: widest
            command: census widest
          - part: sweep-wide
            command: census sweep-wide
          - part: sweep-rest
            command: census sweep-rest
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the pinned versions
        run: grep -hE '^[A-Z0-9_]+=' mygo/versions.env >> "$GITHUB_ENV"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: mygo/go.sum
      - name: Run the part of the sandbox
        run: |
          go -C shared/tooling build -o "$RUNNER_TEMP/vfxtool" ./cmd/vfxtool
          "$RUNNER_TEMP/vfxtool" sandbox ${{ matrix.command }}
