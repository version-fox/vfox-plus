# A release of vfox-plus, started by hand like the releases of
# https://github.com/version-fox/vfox-java: Actions, Release, Run workflow, on
# main, and type the version (1.0.0, without the v). That is the whole procedure.
# A run waits once for the approval of a member of @version-fox/vfox-maintainers
# or @version-fox/vfox-committers, before the signing: that job is the only one
# that names the release environment, because GitHub asks for an approval for
# each job that does. An administrator of the repository may start it without
# the approval. The release environment holds the secrets and the signing
# identity, and only main and the tags v* can use it
# (docs/en/dev/packaging-windows.md#signing-the-release).
#
# The build job checks the request first: the version is new and newer than the
# newest tag, and the last run of mygo on main passed. It sets the version in
# mygo/VERSION, the Version constant of mygo/ui/app.go and the release list of the
# metainfo, and commits that in the name of the person who started the run. It
# builds what mygo.yml builds for Linux (amd64 and arm64), the classic snap of
# snap/snapcraft.yaml, the Windows packages with the publisher of the signing
# certificate, and the Android APK, unsigned. It pushes nothing.
#
# The sign-windows job, which waits for the approval, signs the .msix files, then
# makes the .msixbundle again from them (the signatures make them larger), signs
# it, and installs the bundle without -AllowUnsigned to check that Windows accepts
# it. It signs the APK with the release key, with apksigner.
#
# The publish job attests the Linux packages and checks the assets. Only then does
# it push the version commit to main, tag v<version> and publish the GitHub release,
# which is what the self-update check (mygo/core/update) reads. It needs no approval
# of its own: it names no environment, and runs after the signing. A dry run (the
# dry-run input) does all of it except the push, the tag and the release.
#
# Pushing a tag v* runs the same jobs without setting the version: the commit of
# the tag must say the version already.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, for example 1.0.0 (without v)'
        required: true
        type: string
      dry-run:
        description: 'Build and sign everything, but push nothing, tag nothing and publish nothing'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  LINUX_PACKAGES: >-
    build-essential libgtk-3-0t64 fontconfig fonts-ubuntu fonts-noto-cjk
    xvfb xauth dbus-x11 lintian desktop-file-utils

jobs:
  build:
    name: Check, set the version, build and package
    # Forks do not run CI.
    if: github.repository == 'version-fox/vfox-plus'
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    permissions:
      # actions: read lets the job see the last run of mygo on main.
      actions: read
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      # builddeb names the maintainer of the .deb from this when it builds it: a release
      # names the project, not the placeholder of the CI packages (mygo.yml).
      DEB_MAINTAINER: Han Li and contributors <https://github.com/version-fox/vfox-plus/issues>
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tags are checked, and the version commit is made on this history.
          fetch-depth: 0
      - name: Read the pinned versions
        run: grep -hE '^[A-Z0-9_]+=' mygo/versions.env >> "$GITHUB_ENV"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: mygo/go.sum
      - name: Build vfxtool
        run: go -C shared/tooling build -o "$RUNNER_TEMP/vfxtool" ./cmd/vfxtool
      - name: Check the version
        # The version of the run (vfxtool check-version): a manual run takes it from
        # its input, and the step Set the version writes it into the files. A tag
        # push takes it from the tag, and the commit of the tag must say it already.
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          "$RUNNER_TEMP/vfxtool" check-version --event "$GITHUB_EVENT_NAME" --ref "$GITHUB_REF" \
            --ref-name "$GITHUB_REF_NAME" --input "$INPUT_VERSION" >> "$GITHUB_ENV"
      - name: Output the version
        id: version
        run: echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Check the last mygo run on main
        # The release vets the code and smoke-tests the build, but runs no tests:
        # it starts only when the last run of mygo on main has passed.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          state="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow mygo.yml --branch main --limit 1 --json status,conclusion --jq '.[0] | "\(.status) \(.conclusion)"')"
          if [ "$state" != "completed success" ]; then
            echo "::error::The last mygo run on main is not a passed run ($state): wait for it, or fix main first"
            exit 1
          fi
      - name: Check the Windows publisher
        # The packages carry the subject of the signing certificate as their publisher,
        # so the build needs it (docs/en/dev/packaging-windows.md#signing-the-release).
        env:
          WINDOWS_PUBLISHER: ${{ vars.WINDOWS_PUBLISHER }}
        run: |
          if [ -z "$WINDOWS_PUBLISHER" ]; then
            echo "::error::The repository variable WINDOWS_PUBLISHER is empty: set it to the subject of the signing certificate (docs/en/dev/packaging-windows.md#signing-the-release)"
            exit 1
          fi
      - name: Set the version
        # A manual run writes the version into the files that carry it (vfxtool
        # set-version), and commits them in the name of the person who started the
        # run: the repository wants its commits to name the people who wrote them.
        # The commit reaches main only in the publish job, after everything is signed.
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          "$RUNNER_TEMP/vfxtool" set-version --version "$VERSION"
          id="$(gh api "users/$GITHUB_ACTOR" --jq .id)"
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$id+$GITHUB_ACTOR@users.noreply.github.com"
          if git diff --quiet -- mygo/VERSION mygo/ui/app.go shared/packaging/linux/dev.vfox.VfoxPlus.metainfo.xml; then
            echo "The files say $VERSION already"
          else
            git add -- mygo/VERSION mygo/ui/app.go shared/packaging/linux/dev.vfox.VfoxPlus.metainfo.xml
            git commit -q -m "Release v$VERSION"
          fi
      - name: Keep the commit for the publish job
        # The publish job starts from the commit of the run, so the version commit
        # goes there in a bundle, with the same object name. commit says which commit
        # the release is; a run that set no new version has no bundle.
        run: |
          mkdir -p "$RUNNER_TEMP/version"
          git rev-parse HEAD > "$RUNNER_TEMP/version/commit"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            git bundle create "$RUNNER_TEMP/version/version.bundle" HEAD ^origin/main
          fi
      - name: Install the Linux packages
        uses: ./.github/actions/install-linux-packages
        with:
          packages: ${{ env.LINUX_PACKAGES }}
      - name: Prepare the embedded assets
        # The icons, the translations and the licenses of the Go modules.
        run: '"$RUNNER_TEMP/vfxtool" prepare --root mygo'
      - name: Check the tree
        run: |
          go -C mygo vet ./...
          go -C shared/tooling vet ./...
      - name: Build the release
        run: '"$RUNNER_TEMP/vfxtool" build --root mygo mygo/build/vfox-plus'
      - name: Smoke test the release
        run: '"$RUNNER_TEMP/vfxtool" smoke-test --log app.log mygo/build/vfox-plus'
      - name: Build the .deb and the tarball
        run: |
          install -D -m 755 mygo/build/vfox-plus "$RUNNER_TEMP/stage/vfox-plus"
          # Reproducible timestamps in the package metadata.
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" "$RUNNER_TEMP/vfxtool" build-deb \
            --package vfox-plus --version "$VERSION" \
            --stage "$RUNNER_TEMP/stage" --executable vfox-plus --technology mygo \
            --depends "$("$RUNNER_TEMP/vfxtool" runtask print-depends)" \
            --recommends "$("$RUNNER_TEMP/vfxtool" runtask print-recommends)" \
            --notice mygo/assets/licenses.txt dist
      - name: Build the Linux arm64 release, its .deb and tarball
        # The arm64 program is cross-compiled, as the Windows ones are, and
        # build-deb is told the architecture: it refuses a program of another
        # one. The packages go to dist-arm64, not dist, because the install test
        # of mygo.yml installs every .deb of its directory.
        run: |
          mkdir -p "$RUNNER_TEMP/stage-linux-arm64" dist-arm64
          "$RUNNER_TEMP/vfxtool" build --goos linux --goarch arm64 --root mygo "$RUNNER_TEMP/stage-linux-arm64/vfox-plus"
          # Reproducible timestamps in the package metadata.
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" "$RUNNER_TEMP/vfxtool" build-deb \
            --package vfox-plus --version "$VERSION" --goarch arm64 \
            --stage "$RUNNER_TEMP/stage-linux-arm64" --executable vfox-plus --technology mygo \
            --depends "$("$RUNNER_TEMP/vfxtool" runtask print-depends)" \
            --recommends "$("$RUNNER_TEMP/vfxtool" runtask print-recommends)" \
            --notice mygo/assets/licenses.txt dist-arm64
      - name: Validate the packages
        run: |
          desktop-file-validate shared/packaging/linux/dev.vfox.VfoxPlus.desktop
          lintian --fail-on error --suppress-tags malformed-contact,bogus-mail-host-in-debian-changelog dist/*.deb dist-arm64/*.deb
          test "$(dpkg-deb -f "dist-arm64/vfox-plus_${VERSION}_arm64.deb" Architecture)" = arm64
      - name: Build the snap package
        # Classic confinement (see snap/snapcraft.yaml): vfox-plus drives the
        # vfox executable and arbitrary SDK toolchains anywhere on the file
        # system. The snap packs the amd64 .deb above and is installed by hand, not
        # from the store, and it is not signed (docs/en/user/install.md#linux).
        run: cp dist/vfox-plus_*_amd64.deb snap/vfox-plus.deb
      - uses: snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79 # v1.3.0
      - name: Collect the snap package
        run: |
          mkdir -p dist-snap
          find . -maxdepth 2 -name 'vfox-plus_*.snap' -exec mv {} dist-snap/ \;
          ls dist-snap
      - name: Cross-compile the Windows executables
        # mygo needs no C compiler, so the Windows builds run on Linux.
        run: |
          "$RUNNER_TEMP/vfxtool" build --goos windows --goarch amd64 --root mygo "$RUNNER_TEMP/stage-x64/vfox-plus.exe"
          "$RUNNER_TEMP/vfxtool" build --goos windows --goarch arm64 --root mygo "$RUNNER_TEMP/stage-arm64/vfox-plus.exe"
      - name: Build the .msix and .msixbundle for signing
        # The packages carry the subject of the certificate as their publisher from
        # the start. sign-windows signs them, and makes the bundle again from them
        # (vfxtool rebundle), so the bundle built here is replaced.
        env:
          WINDOWS_PUBLISHER: ${{ vars.WINDOWS_PUBLISHER }}
        run: |
          mkdir -p dist-windows
          # Reproducible timestamps in the package metadata.
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" "$RUNNER_TEMP/vfxtool" build-msix \
            --package vfox-plus --version "$VERSION" --publisher "$WINDOWS_PUBLISHER" \
            --stage-x64 "$RUNNER_TEMP/stage-x64" --stage-arm64 "$RUNNER_TEMP/stage-arm64" \
            --executable vfox-plus.exe dist-windows
      - name: Stage vfxtool for the Windows steps
        # The sign-windows job runs this Windows build of vfxtool to put the signed
        # packages into the bundle again, and to install it.
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go -C shared/tooling build -o "$PWD/dist-windows/vfxtool.exe" ./cmd/vfxtool
      - name: Validate the MSIX packages
        # Pure-Go validation without the Windows SDK (vfxtool validate-msix): ZIP
        # layout, manifests, block maps, bundle offsets, version consistency, and the
        # publisher of the certificate on both architectures.
        env:
          WINDOWS_PUBLISHER: ${{ vars.WINDOWS_PUBLISHER }}
        run: |
          ls -la dist-windows
          "$RUNNER_TEMP/vfxtool" validate-msix --publisher "$WINDOWS_PUBLISHER" dist-windows
      - name: Read the pinned Android versions
        run: grep -hE '^[A-Z0-9_]+=' android/versions.env >> "$GITHUB_ENV"
      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Set up the Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          # The default package list still names the `tools` package, which
          # Google removed; install only what the build needs.
          packages: platform-tools
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          # Only the caches: android/gradlew is Gradle Wrapper Neo, which has
          # no wrapper jar to validate.
          validate-wrappers: false
      - name: Build the unsigned release APK
        # Without the release key: the sign-windows job signs the APK, and only that job
        # reads the key. After Set the version, so the APK carries the version it is
        # released as.
        env:
          ANDROID_RELEASE_UNSIGNED: '1'
        run: ./gradlew :app:assembleRelease
        working-directory: android
      - name: Keep the unsigned APK
        run: |
          mkdir -p dist-android-unsigned
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk "dist-android-unsigned/vfox-plus_${VERSION}-unsigned.apk"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vfox-plus-linux-x64
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vfox-plus-linux-arm64
          path: dist-arm64/*
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vfox-plus-snap
          path: dist-snap/*
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vfox-plus-windows
          path: dist-windows/*
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vfox-plus-android-unsigned
          path: dist-android-unsigned/*
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vfox-plus-version
          path: ${{ runner.temp }}/version/*
          if-no-files-found: error

  sign-windows:
    name: Sign the Windows packages and the APK with the release key
    # Forks do not run CI.
    if: github.repository == 'version-fox/vfox-plus'
    needs: build
    # The signing identity and the release key are in this environment, and a run
    # waits here for the one approval of the release (see the top of this file). The
    # federated credential of Azure is bound to this environment, and no other job
    # names it: no other job can sign, and none can read the release key.
    environment: release
    permissions:
      # id-token: write lets the job log in to Azure with the identity of the release.
      contents: read
      id-token: write
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.build.outputs.version }}
      WINDOWS_PUBLISHER: ${{ vars.WINDOWS_PUBLISHER }}
    steps:
      - name: Check the signing settings
        # Each of them is named in the failure, so that the fix is clear before the
        # signing starts (docs/en/dev/packaging-windows.md#signing-the-release).
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          ARTIFACT_SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          ARTIFACT_SIGNING_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
        shell: pwsh
        run: |
          $missing = @()
          foreach ($name in "AZURE_CLIENT_ID", "AZURE_TENANT_ID", "AZURE_SUBSCRIPTION_ID", "ANDROID_RELEASE_KEYSTORE_BASE64", "ANDROID_RELEASE_STORE_PASSWORD", "ANDROID_RELEASE_KEY_ALIAS", "ANDROID_RELEASE_KEY_PASSWORD", "ARTIFACT_SIGNING_ENDPOINT", "ARTIFACT_SIGNING_ACCOUNT", "ARTIFACT_SIGNING_PROFILE", "WINDOWS_PUBLISHER") {
            if (-not [Environment]::GetEnvironmentVariable($name)) { $missing += $name }
          }
          if ($missing) { throw "not set in the release environment or the variables: $($missing -join ', ')" }
      - name: Check out the repository
        # Before the downloads: a checkout cleans the workspace of the files that the
        # downloads put there. The pinned versions of android/versions.env are read from it.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download the Windows packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vfox-plus-windows
          path: dist-windows
      - name: Log in to Azure
        # The federated credential of the release environment: no secret of the
        # signing is kept, the job asks Azure for a token of this run.
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign the .msix packages
        # The packages are signed first: the bundle holds their sizes and offsets,
        # so it is made again after the signing, and then signed.
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files: |
            ${{ github.workspace }}\dist-windows\vfox-plus_${{ env.VERSION }}_x64.msix
            ${{ github.workspace }}\dist-windows\vfox-plus_${{ env.VERSION }}_arm64.msix
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          # The Azure CLI login above is the identity: the other sources of credentials stay out.
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
      - name: Put the signed packages into the bundle again
        # vfxtool rebundle refuses a package that is not signed.
        shell: pwsh
        run: |
          $tool = Join-Path $env:GITHUB_WORKSPACE "dist-windows/vfxtool.exe"
          $arguments = @("rebundle", "--package", "vfox-plus", "--version", $env:VERSION, "--publisher", $env:WINDOWS_PUBLISHER, "dist-windows")
          & $tool @arguments
          if ($LASTEXITCODE -ne 0) { throw "rebundle failed with exit code $LASTEXITCODE" }
      - name: Sign the .msixbundle
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\dist-windows\vfox-plus_${{ env.VERSION }}.msixbundle
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
      - name: Show the publisher of the signed bundle
        # The subject of the certificate is the publisher that WINDOWS_PUBLISHER must
        # name, exactly. It is printed here, so that the variable can be set from this
        # log when install-check refuses the bundle for another publisher.
        shell: pwsh
        run: |
          # Information only: the install below is the check, so a cmdlet that does not
          # read the package does not stop the release here.
          $bundle = Join-Path $env:GITHUB_WORKSPACE "dist-windows/vfox-plus_$($env:VERSION).msixbundle"
          try {
            $signature = Get-AuthenticodeSignature -FilePath $bundle
            Write-Host "signature: $($signature.Status); certificate subject: $($signature.SignerCertificate.Subject)"
          } catch {
            Write-Host "the signature cannot be read here: $_"
          }
          Write-Host "WINDOWS_PUBLISHER is: $($env:WINDOWS_PUBLISHER)"
      - name: Install and uninstall the signed bundle
        # The check that the release is for: Windows installs the bundle without
        # -AllowUnsigned, which it accepts only when the signature and the publisher
        # hold, and the certificates of the machine are left alone. The x64 slice
        # is the one this runner takes; install-check prints the AppX deployment log
        # when the install fails.
        shell: pwsh
        run: |
          $tool = Join-Path $env:GITHUB_WORKSPACE "dist-windows/vfxtool.exe"
          & $tool install-check --directory dist-windows --arch x64 --trusted
          if ($LASTEXITCODE -ne 0) { throw "install-check failed with exit code $LASTEXITCODE" }
      - name: Download the unsigned APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vfox-plus-android-unsigned
          path: dist-android-unsigned
      - name: Read the pinned Android versions
        shell: pwsh
        run: |
          Get-Content android/versions.env | ForEach-Object { $_.Trim() } | Where-Object { $_ -match '^[A-Z0-9_]+=' } | Add-Content -Path $env:GITHUB_ENV
      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Set up the Android build tools
        # zipalign and apksigner come with the build tools of the pinned version.
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: "build-tools;${{ env.ANDROID_SDK_BUILD_TOOLS }}"
      - name: Sign the APK with the release key
        # zipalign aligns the APK first, as the Android Gradle plugin does, and apksigner
        # signs it with the release key of the environment. The keystore goes to the
        # temporary directory of the runner, and is removed whatever the outcome.
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:ANDROID_HOME) { throw "ANDROID_HOME is not set: the Android SDK setup did not run" }
          $buildTools = Join-Path $env:ANDROID_HOME "build-tools/$env:ANDROID_SDK_BUILD_TOOLS"
          $zipalign = Join-Path $buildTools "zipalign.exe"
          $apksigner = Join-Path $buildTools "apksigner.bat"
          $unsigned = Join-Path $env:GITHUB_WORKSPACE "dist-android-unsigned/vfox-plus_$($env:VERSION)-unsigned.apk"
          $aligned = Join-Path $env:RUNNER_TEMP "vfox-plus-aligned.apk"
          $keystore = Join-Path $env:RUNNER_TEMP "android-release.keystore"
          $signed = Join-Path $env:GITHUB_WORKSPACE "dist-android/vfox-plus_$($env:VERSION).apk"
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $signed) | Out-Null
          try {
            [IO.File]::WriteAllBytes($keystore, [Convert]::FromBase64String($env:ANDROID_RELEASE_KEYSTORE_BASE64))
            & $zipalign -p -f 4 $unsigned $aligned
            if ($LASTEXITCODE -ne 0) { throw "zipalign failed with exit code $LASTEXITCODE" }
            & $apksigner sign --ks $keystore --ks-key-alias $env:ANDROID_RELEASE_KEY_ALIAS --ks-pass env:ANDROID_RELEASE_STORE_PASSWORD --key-pass env:ANDROID_RELEASE_KEY_PASSWORD --out $signed $aligned
            if ($LASTEXITCODE -ne 0) { throw "apksigner sign failed with exit code $LASTEXITCODE" }
            & $apksigner verify --print-certs $signed
            if ($LASTEXITCODE -ne 0) { throw "apksigner verify failed with exit code $LASTEXITCODE" }
          } finally {
            Remove-Item -Force -ErrorAction SilentlyContinue -Path $keystore, $aligned
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vfox-plus-android
          path: dist-android/*
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vfox-plus-windows-signed
          path: |
            dist-windows/*.msix
            dist-windows/*.msixbundle
          if-no-files-found: error

  publish:
    name: Attest, push the version commit, tag and publish
    # Forks do not run CI.
    if: github.repository == 'version-fox/vfox-plus'
    # No environment: nothing here needs a secret, and the approval of the run is the
    # one of sign-windows, which this job waits for.
    needs: [build, sign-windows]
    permissions:
      # attestations and id-token let the job attest the Linux packages.
      attestations: write
      contents: write
      id-token: write
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tags are checked, and the version commit is fast-forwarded below.
          fetch-depth: 0
      - name: Read the pinned versions
        run: grep -hE '^[A-Z0-9_]+=' mygo/versions.env >> "$GITHUB_ENV"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: mygo/go.sum
      - name: Build vfxtool
        run: go -C shared/tooling build -o "$RUNNER_TEMP/vfxtool" ./cmd/vfxtool
      - name: Download the Linux packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vfox-plus-linux-x64
          path: dist
      - name: Download the arm64 packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vfox-plus-linux-arm64
          path: dist-arm64
      - name: Download the snap
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vfox-plus-snap
          path: dist-snap
      - name: Download the signed Windows packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vfox-plus-windows-signed
          path: dist-windows
      - name: Download the signed APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vfox-plus-android
          path: dist-android
      - name: Download the commit of the run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vfox-plus-version
          path: version
      - name: Apply the version commit
        # The commit of the build, from its bundle: the same object, so the tag names
        # the commit that was built. A run that set no version has no bundle.
        run: |
          if [ -f version/version.bundle ]; then
            git fetch --no-tags "$GITHUB_WORKSPACE/version/version.bundle" HEAD
            git merge --ff-only FETCH_HEAD
          fi
          # The job publishes the commit that the build made, and no other.
          test "$(git rev-parse HEAD)" = "$(cat version/commit)"
      - name: Check the assets
        # check-assets names the files of the release, and stops it before anything is
        # pushed when a kind of them is missing or doubled.
        run: '"$RUNNER_TEMP/vfxtool" check-assets --version "$VERSION"'
      - name: Attest the Linux packages
        # A build attestation names the workflow that built each file. Check it with
        # gh attestation verify (docs/en/user/install.md#linux). It is made before
        # anything is pushed.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.deb
            dist/*.tar.gz
            dist-arm64/*.deb
            dist-arm64/*.tar.gz
      - name: Set the identity of the tag
        # The tag is made in the name of the person who started the run, like the commit.
        if: github.event_name == 'workflow_dispatch' && inputs.dry-run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          id="$(gh api "users/$GITHUB_ACTOR" --jq .id)"
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$id+$GITHUB_ACTOR@users.noreply.github.com"
      - name: Push the version commit and tag the release
        # Nothing has been pushed before this step, so a run that fails while it builds
        # leaves main and the tags as they were. The push is refused, and nothing is
        # tagged, when main has moved since the run started.
        if: github.event_name == 'workflow_dispatch' && inputs.dry-run != true
        run: |
          if [ -f version/version.bundle ]; then
            git push origin HEAD:refs/heads/main
          fi
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin "v$VERSION"
      - name: Publish the GitHub release
        # The self-update check (mygo/core/update) reads the .deb (preferred) or the
        # .tar.gz on Linux, for amd64 and arm64, and the .msix (preferred) or the
        # .msixbundle on Windows. The APK and the .snap are for manual use.
        if: inputs.dry-run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          assets="$("$RUNNER_TEMP/vfxtool" check-assets --version "$VERSION")"
          mapfile -t files <<< "$assets"
          gh release create "v$VERSION" --title "v$VERSION" --generate-notes "${files[@]}"
