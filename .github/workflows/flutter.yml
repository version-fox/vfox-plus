# The Flutter implementation: formatting, static analysis, tests with coverage,
# end-to-end tests of the Linux app (against captured output and against the
# real vfox) and the Linux packages. flutter/sandbox/run-task.sh runs the same
# steps locally; keep them in sync. The tool versions are in flutter/versions.env.
name: Flutter

on:
  push:
    branches: [main]
    paths:
      - flutter/**
      - shared/**
      - .github/workflows/flutter.yml
  pull_request:
    paths:
      - flutter/**
      - shared/**
      - .github/workflows/flutter.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Packages needed to build and run Flutter Linux desktop applications.
  LINUX_PACKAGES: >-
    clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
    patchelf lintian desktop-file-utils xvfb xauth

defaults:
  run:
    working-directory: flutter

jobs:
  check:
    name: Format, analyze and test
    # Forks do not run CI.
    if: github.repository == 'version-fox/vfox-plus'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the pinned versions
        run: grep -E '^[A-Z0-9_]+=' versions.env >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Check that pubspec.lock only uses pub.dev
        run: |
          # Contributors behind a pub mirror (PUB_HOSTED_URL) must not commit its URL.
          if grep -n 'url: "' pubspec.lock | grep -v '"https://pub.dev"'; then
            echo "::error file=flutter/pubspec.lock::Regenerate pubspec.lock without PUB_HOSTED_URL."
            exit 1
          fi
      - name: Get dependencies
        run: flutter pub get --enforce-lockfile
      - name: Generate the icon font
        # The font subset is a build output, not committed. Builds download
        # the font-subset tool on demand; tests do not.
        run: |
          flutter precache --no-android --no-ios
          dart run tool/generate_icon_font.dart
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test tool integration_test
      - name: Check that generated code is up to date
        run: |
          flutter gen-l10n
          git diff --exit-code -- lib/src/l10n lib/src/ui/icons
      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings
      - name: Test
        run: flutter test --coverage
      - name: Check coverage
        run: dart run tool/coverage.dart --min=85
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage
          path: flutter/coverage/lcov.info
          if-no-files-found: ignore

  integration:
    name: End-to-end test on Linux
    # Forks do not run CI.
    if: github.repository == 'version-fox/vfox-plus'
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          # shellcheck disable=SC2086 # The list is meant to be split.
          sudo apt-get install -y --no-install-recommends $LINUX_PACKAGES
      - name: Read the pinned versions
        run: grep -E '^[A-Z0-9_]+=' versions.env >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Get dependencies
        run: flutter pub get --enforce-lockfile
      - name: Generate the icon font
        # The font subset is a build output, not committed. Builds download
        # the font-subset tool on demand; tests do not.
        run: |
          flutter precache --no-android --no-ios
          dart run tool/generate_icon_font.dart
      - name: Install vfox
        run: |
          archive="vfox_${VFOX_VERSION}_linux_x86_64"
          curl -fsSL --retry 5 -o "$RUNNER_TEMP/$archive.tar.gz" \
            "https://github.com/version-fox/vfox/releases/download/v$VFOX_VERSION/$archive.tar.gz"
          echo "$VFOX_SHA256  $RUNNER_TEMP/$archive.tar.gz" | sha256sum --check --strict -
          tar -xzf "$RUNNER_TEMP/$archive.tar.gz" -C "$RUNNER_TEMP"
          # Enables integration_test/real_vfox_test.dart.
          echo "VFOX_PLUS_E2E_VFOX=$RUNNER_TEMP/$archive/vfox" >> "$GITHUB_ENV"
      - name: Run the integration tests in a virtual display
        run: |
          # flutter test starts a desktop application only once per run, so
          # every file runs on its own.
          for test in integration_test/*_test.dart; do
            xvfb-run -a -s "-screen 0 1280x800x24" flutter test "$test" -d linux
          done

  package:
    name: Linux packages
    # Forks do not run CI.
    if: github.repository == 'version-fox/vfox-plus'
    needs: check
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          # shellcheck disable=SC2086 # The list is meant to be split.
          sudo apt-get install -y --no-install-recommends $LINUX_PACKAGES
      - name: Read the pinned versions
        run: grep -E '^[A-Z0-9_]+=' versions.env >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Get dependencies
        run: flutter pub get --enforce-lockfile
      - name: Generate the icon font
        # The font subset is a build output, not committed. Builds download
        # the font-subset tool on demand; tests do not.
        run: |
          flutter precache --no-android --no-ios
          dart run tool/generate_icon_font.dart
      - name: Build the release bundle
        run: flutter build linux --release
      - name: Smoke test the release bundle
        run: |
          bundle="$PWD/build/linux/x64/release/bundle/vfox-plus"
          xvfb-run -a -s "-screen 0 1280x800x24" "$bundle" > app.log 2>&1 &
          sleep 15
          if ! pgrep -f "^$bundle" > /dev/null; then
            cat app.log
            echo "::error::vfox+ exited during startup"
            exit 1
          fi
          pkill -f "^$bundle"
      - name: Build the .deb and the tarball
        run: |
          # Reproducible timestamps in the package metadata.
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" packaging/linux/build_deb.sh "$GITHUB_WORKSPACE/dist"
      - name: Validate the packages
        run: |
          desktop-file-validate packaging/linux/dev.vfox.VfoxPlus.desktop
          # CI packages carry a placeholder maintainer; releases set DEB_MAINTAINER.
          lintian --fail-on error --suppress-tags malformed-contact,bogus-mail-host-in-debian-changelog \
            "$GITHUB_WORKSPACE"/dist/*.deb
      - name: Install the .deb into a clean Ubuntu container
        # The application must start with nothing but the declared dependencies.
        run: |
          docker run --rm --init \
            --volume "$PWD/sandbox/run-task.sh:/run-task.sh:ro" \
            --volume "$GITHUB_WORKSPACE/dist:/pkg:ro" \
            ubuntu:26.04 bash /run-task.sh install-test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vfox-plus-linux-x64
          path: dist/*
          if-no-files-found: error
