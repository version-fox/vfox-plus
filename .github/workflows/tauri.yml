# The Tauri implementation: formatting, Clippy and tests of the Rust side,
# the end-to-end scenarios of the web front end in the application (against
# captured output and against the real vfox) and the Linux packages.
# tauri/sandbox/run-task.sh runs the same steps locally; keep them in sync.
# The tool versions are in tauri/versions.env and web/versions.env.
name: Tauri

on:
  push:
    branches: [main]
    paths:
      - tauri/**
      - web/**
      - shared/**
      - .github/workflows/tauri.yml
  pull_request:
    paths:
      - tauri/**
      - web/**
      - shared/**
      - .github/workflows/tauri.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Packages needed to build and run Tauri applications on Linux.
  LINUX_PACKAGES: >-
    build-essential pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev
    fonttools python3-brotli xvfb xauth dbus-x11 lintian desktop-file-utils

jobs:
  build:
    name: Check, test end to end and package
    # Forks do not run CI.
    if: github.repository == 'version-fox/vfox-plus'
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the pinned versions
        run: grep -hE '^[A-Z0-9_]+=' web/versions.env tauri/versions.env >> "$GITHUB_ENV"
      - name: Install the Linux packages
        run: |
          sudo apt-get update
          # shellcheck disable=SC2086 # The list is meant to be split.
          sudo apt-get install -y --no-install-recommends $LINUX_PACKAGES
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            tauri/package-lock.json
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt --component clippy
          rustup default "$RUST_VERSION"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: tauri/src-tauri
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/material-symbols
          key: material-symbols-${{ hashFiles('shared/tools/icon_font.py') }}
      - name: Prepare the front end and the icons
        run: |
          python3 shared/tools/icon_font.py download ~/.cache/material-symbols
          export VFOX_PLUS_SYMBOLS="$HOME/.cache/material-symbols"
          (cd web && npm ci && npm run assets && npm run build:tauri)
          (cd tauri && npm ci && npm run icons > /dev/null)
      - name: Check formatting
        working-directory: tauri/src-tauri
        run: cargo fmt --check
      - name: Clippy
        working-directory: tauri/src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        working-directory: tauri/src-tauri
        run: cargo test --locked
      - name: Install vfox
        run: |
          archive="vfox_${VFOX_VERSION}_linux_x86_64"
          curl -fsSL --retry 5 -o "$RUNNER_TEMP/$archive.tar.gz" \
            "https://github.com/version-fox/vfox/releases/download/v$VFOX_VERSION/$archive.tar.gz"
          echo "$VFOX_SHA256  $RUNNER_TEMP/$archive.tar.gz" | sha256sum --check --strict -
          tar -xzf "$RUNNER_TEMP/$archive.tar.gz" -C "$RUNNER_TEMP"
          echo "VFOX_PLUS_E2E_VFOX=$RUNNER_TEMP/$archive/vfox" >> "$GITHUB_ENV"
      - name: Build the end-to-end test build
        run: |
          (cd web && npm run build:e2e:tauri)
          cd tauri
          npx tauri build --no-bundle --config \
            '{"build": {"frontendDist": "../../web/dist/tauri-e2e", "beforeBuildCommand": ""}}'
          cp src-tauri/target/release/vfox-plus "$RUNNER_TEMP/vfox-plus-e2e"
      - name: Run the end-to-end scenarios in a virtual display
        run: |
          for scenario in fake real measure; do
            xvfb-run -a -s "-screen 0 1280x800x24" dbus-run-session -- \
              bash web/e2e/run.sh "$scenario" "$RUNNER_TEMP/vfox-plus-e2e"
          done
      - name: Build the release
        working-directory: tauri
        run: npx tauri build --no-bundle
      - name: Smoke test the release
        run: |
          binary="$PWD/tauri/src-tauri/target/release/vfox-plus"
          xvfb-run -a -s "-screen 0 1280x800x24" "$binary" > app.log 2>&1 &
          sleep 15
          if ! pgrep -f "^$binary" > /dev/null; then
            cat app.log
            echo "::error::vfox+ exited during startup"
            exit 1
          fi
          pkill -f "^$binary"
      - name: Build the .deb and the tarball
        run: |
          install -D -m 755 tauri/src-tauri/target/release/vfox-plus "$RUNNER_TEMP/stage/vfox-plus"
          # Reproducible timestamps in the package metadata.
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" bash shared/packaging/linux/build-deb.sh \
            --package vfox-plus-tauri --version "$(jq -r .version tauri/src-tauri/tauri.conf.json)" \
            --stage "$RUNNER_TEMP/stage" --executable vfox-plus --technology Tauri \
            --depends "$(sed -n 's/^DEPENDS="\(.*\)"$/\1/p' tauri/sandbox/run-task.sh)" \
            --notice web/public/licenses.txt dist
      - name: Validate the packages
        run: |
          desktop-file-validate shared/packaging/linux/dev.vfox.VfoxPlus.desktop
          # CI packages carry a placeholder maintainer; releases set DEB_MAINTAINER.
          lintian --fail-on error --suppress-tags malformed-contact,bogus-mail-host-in-debian-changelog dist/*.deb
      - name: Install the .deb into a clean Ubuntu container
        # The application must start with nothing but the declared dependencies.
        run: |
          docker run --rm --init \
            --volume "$PWD/shared/sandbox/task-lib.sh:/task-lib.sh:ro" \
            --volume "$PWD/tauri/sandbox/run-task.sh:/run-task.sh:ro" \
            --volume "$PWD/dist:/pkg:ro" \
            --env TASK_LIB=/task-lib.sh \
            ubuntu:26.04 bash /run-task.sh install-test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vfox-plus-tauri-linux-x64
          path: dist/*
          if-no-files-found: error
