# Checks that apply to the whole repository, whatever the implementation.
name: Repository

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  license-header:
    name: License headers
    # Forks do not run CI.
    if: github.repository == 'version-fox/vfox-plus'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: apache/skywalking-eyes/header@a196742f472feaffafea537ce5a2a4c3c53a8de4 # v0.9.0
        with:
          config: .licenserc.yaml
          mode: check
          # Do not comment on pull requests; the workflow only has read access.
          token: ""

  lint:
    name: Workflows and tools
    # Forks do not run CI.
    if: github.repository == 'version-fox/vfox-plus'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint GitHub Actions workflows
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color
      - name: Read the pinned versions
        run: grep -hE '^[A-Z0-9_]+=' mygo/versions.env >> "$GITHUB_ENV"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Vet and test vfxtool
        run: |
          test -z "$(gofmt -l shared/tooling)"
          go -C shared/tooling vet ./...
          go -C shared/tooling test ./...
          # `vfxtool sign-msix` runs on the user's Windows machine, as the
          # vfxtool.exe of the artifact, so vfxtool must always cross-compile;
          # its Windows files are vetted too, which `go vet` above does not reach.
          GOOS=windows CGO_ENABLED=0 go -C shared/tooling build ./...
          GOOS=windows CGO_ENABLED=0 go -C shared/tooling vet ./...
      - name: Check documentation languages
        run: go -C shared/tooling run ./cmd/vfxtool docs-check
      - name: Keep binary files out of the repository
        run: |
          # Images belong on an image host, and build outputs such as the icon
          # font are generated. The fixtures escape their control characters.
          binaries="$(git ls-files --eol | awk -F '\t' '{ split($1, info, " ") } info[1] == "i/-text" { print $2 }')"
          if [ -n "$binaries" ]; then
            echo "::error::Do not commit binary files; host images and generate build outputs instead: $binaries"
            exit 1
          fi
      - name: Validate shared JSON resources
        run: |
          for file in shared/icons.json shared/i18n/*.arb shared/fixtures/*/cases.json; do
            jq empty "$file" || { echo "::error file=$file::Invalid JSON"; exit 1; }
          done
