# The Compose Multiplatform implementation: formatting (ktlint), compilation
# with warnings as errors, the license check, the unit tests with the coverage
# gate, the end-to-end tests against captured output and against the real
# vfox, the memory measurement and the Linux packages.
# compose/sandbox/run-task.sh runs the same steps locally; keep them in sync.
# The tool versions are in compose/versions.env, the libraries in
# compose/gradle/libs.versions.toml.
name: Compose

on:
  push:
    branches: [main]
    paths:
      - compose/**
      - shared/**
      - .github/workflows/compose.yml
  pull_request:
    paths:
      - compose/**
      - shared/**
      - .github/workflows/compose.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The icon fonts, the virtual display and the package checks.
  LINUX_PACKAGES: fonttools xvfb xauth dbus-x11 lintian desktop-file-utils

jobs:
  build:
    name: Check, test end to end and package
    # Forks do not run CI.
    if: github.repository == 'version-fox/vfox-plus'
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: compose
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the pinned versions
        run: grep -hE '^[A-Z0-9_]+=' versions.env >> "$GITHUB_ENV"
      - name: Install the Linux packages
        run: |
          sudo apt-get update
          # shellcheck disable=SC2086 # The list is meant to be split.
          sudo apt-get install -y --no-install-recommends $LINUX_PACKAGES
      - name: Download the JDK
        run: |
          version="${JDK_RELEASE#jdk-}"
          url="https://github.com/adoptium/temurin${JDK_MAJOR}-binaries/releases/download/${JDK_RELEASE/+/%2B}/OpenJDK${JDK_MAJOR}U-jdk_x64_linux_hotspot_${version/+/_}.tar.gz"
          curl -fsSL --retry 5 -o "$RUNNER_TEMP/jdk.tar.gz" "$url"
          echo "$JDK_SHA256  $RUNNER_TEMP/jdk.tar.gz" | sha256sum --check --strict -
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: jdkfile
          jdk-file: ${{ runner.temp }}/jdk.tar.gz
          java-version: ${{ env.JDK_MAJOR }}
      - name: Install Gradle
        run: |
          curl -fsSL --retry 5 -o "$RUNNER_TEMP/gradle.zip" "https://services.gradle.org/distributions/gradle-$GRADLE_VERSION-bin.zip"
          echo "$GRADLE_SHA256  $RUNNER_TEMP/gradle.zip" | sha256sum --check --strict -
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-$GRADLE_VERSION/bin" >> "$GITHUB_PATH"
      # Caches the dependencies of the build.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/material-symbols
          key: material-symbols-${{ hashFiles('shared/tools/icon_font.py') }}
      - name: Download Material Symbols
        run: |
          python3 ../shared/tools/icon_font.py download ~/.cache/material-symbols
          echo "VFOX_PLUS_SYMBOLS=$HOME/.cache/material-symbols" >> "$GITHUB_ENV"
      - name: Check formatting, lint, licenses and test with the coverage gate
        run: gradle --console=plain spotlessCheck checkLicense test koverVerify
      - name: Install vfox
        run: |
          archive="vfox_${VFOX_VERSION}_linux_x86_64"
          curl -fsSL --retry 5 -o "$RUNNER_TEMP/$archive.tar.gz" \
            "https://github.com/version-fox/vfox/releases/download/v$VFOX_VERSION/$archive.tar.gz"
          echo "$VFOX_SHA256  $RUNNER_TEMP/$archive.tar.gz" | sha256sum --check --strict -
          tar -xzf "$RUNNER_TEMP/$archive.tar.gz" -C "$RUNNER_TEMP"
          echo "VFOX_PLUS_E2E_VFOX=$RUNNER_TEMP/$archive/vfox" >> "$GITHUB_ENV"
      - name: Run the end-to-end tests
        run: gradle --console=plain e2eTest
      - name: Build the application image
        run: gradle --console=plain createDistributable
      - name: Smoke test the application image and measure its memory
        env:
          # The measurement writes its numbers here for memory.yml.
          VFOX_PLUS_MEASURE_OUTPUT: ${{ runner.temp }}/memory/memory.txt
        run: |
          binary="$PWD/build/compose/binaries/main/app/vfox-plus/bin/vfox-plus"
          xvfb-run -a -s "-screen 0 1280x800x24" "$binary" > app.log 2>&1 &
          sleep 20
          if ! pgrep -f "^$binary" > /dev/null; then
            cat app.log
            echo "::error::vfox+ exited during startup"
            exit 1
          fi
          pkill -f "^$binary"
          xvfb-run -a -s "-screen 0 1280x800x24" dbus-run-session -- bash ../shared/tools/measure.sh "$binary"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: memory-compose
          path: ${{ runner.temp }}/memory/memory.txt
          if-no-files-found: error
          overwrite: true
      - name: Build the .deb and the tarball
        run: |
          # Reproducible timestamps in the package metadata.
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" bash ../shared/packaging/linux/build-deb.sh \
            --package vfox-plus-compose --version "$(sed -n 's/^version = "\(.*\)"$/\1/p' build.gradle.kts)" \
            --stage build/compose/binaries/main/app/vfox-plus --executable bin/vfox-plus \
            --technology "Compose Multiplatform" --strip \
            --override embedded-library --override jar-not-in-usr-share --override codeless-jar \
            --depends "$(sed -n 's/^DEPENDS="\(.*\)"$/\1/p' sandbox/run-task.sh)" \
            --notice build/reports/dependency-license/THIRD-PARTY-NOTICES.txt ../dist
      - name: Validate the packages
        run: |
          desktop-file-validate ../shared/packaging/linux/dev.vfox.VfoxPlus.desktop
          # CI packages carry a placeholder maintainer; releases set DEB_MAINTAINER.
          lintian --fail-on error --suppress-tags malformed-contact,bogus-mail-host-in-debian-changelog ../dist/*.deb
      - name: Install the .deb into a clean Ubuntu container
        # The application must start with nothing but the declared dependencies.
        working-directory: .
        run: |
          docker run --rm --init \
            --volume "$PWD/shared/sandbox/task-lib.sh:/task-lib.sh:ro" \
            --volume "$PWD/compose/sandbox/run-task.sh:/run-task.sh:ro" \
            --volume "$PWD/dist:/pkg:ro" \
            --env TASK_LIB=/task-lib.sh \
            ubuntu:26.04 bash /run-task.sh install-test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vfox-plus-compose-linux-x64
          path: dist/*
          if-no-files-found: error
