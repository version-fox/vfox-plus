# The Uno implementation: formatting, the build with warnings as errors and the
# unit tests (with a coverage gate), the end-to-end scenarios in the application
# (against captured output and against the real vfox) and the Linux packages.
# uno/sandbox/run-task.sh runs the same steps locally; keep them in sync.
# The tool versions are in uno/versions.env (Node.js, which only runs the test
# server of the end-to-end scenarios, is the one of web/versions.env); the
# version of Uno is the one of the Uno.Sdk in uno/global.json.
name: Uno

on:
  push:
    branches: [main]
    paths:
      - uno/**
      - web/e2e/**
      - web/src/e2e/**
      - shared/**
      - .github/workflows/uno.yml
  pull_request:
    paths:
      - uno/**
      - web/e2e/**
      - web/src/e2e/**
      - shared/**
      - .github/workflows/uno.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # What the application loads on Linux (Uno through X11, Skia, ICU) and what the
  # tests and the packages need: fontconfig and the fonts are what the interface
  # looks up; xvfb and dbus run the scenarios; lintian and desktop-file-utils
  # check the packages.
  LINUX_PACKAGES: >-
    libx11-6 libxext6 libxfixes3 libxi6 libxrandr2 libfontconfig1 fontconfig
    libfreetype6 libexpat1 zlib1g libbz2-1.0 libpng16-16t64 libbrotli1 libicu78
    libssl3t64 fonts-ubuntu fonts-noto-cjk fonttools python3-brotli xvfb xauth
    dbus dbus-x11 lintian desktop-file-utils

jobs:
  build:
    name: Check, test end to end and package
    # Forks do not run CI.
    if: github.repository == 'version-fox/vfox-plus'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the pinned versions
        run: grep -hE '^[A-Z0-9_]+=' web/versions.env uno/versions.env >> "$GITHUB_ENV"
      - name: Install the Linux packages
        run: |
          sudo apt-get update
          # shellcheck disable=SC2086 # The list is meant to be split.
          sudo apt-get install -y --no-install-recommends $LINUX_PACKAGES
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install the .NET SDK
        # The release archive, verified against the checksum of the release metadata.
        run: |
          archive="dotnet-sdk-$DOTNET_VERSION-linux-x64.tar.gz"
          curl -fsSL --retry 5 -o "$RUNNER_TEMP/$archive" \
            "https://builds.dotnet.microsoft.com/dotnet/Sdk/$DOTNET_VERSION/$archive"
          echo "$DOTNET_SHA512  $RUNNER_TEMP/$archive" | sha512sum --check --strict -
          mkdir "$RUNNER_TEMP/dotnet"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/dotnet"
          echo "$RUNNER_TEMP/dotnet" >> "$GITHUB_PATH"
          {
            echo "DOTNET_ROOT=$RUNNER_TEMP/dotnet"
            echo "DOTNET_CLI_TELEMETRY_OPTOUT=1"
            echo "DOTNET_NOLOGO=1"
          } >> "$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/material-symbols
          key: material-symbols-${{ hashFiles('shared/tools/icon_font.py') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('uno/global.json', 'uno/Directory.Packages.props', 'uno/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Prepare the generated assets
        # The icon fonts, the translations and the licenses of the ported code.
        run: bash uno/tools/prepare.sh
      - name: Restore the packages
        working-directory: uno
        run: dotnet restore VfoxPlus.slnx
      - name: Check formatting
        working-directory: uno
        run: dotnet format VfoxPlus.slnx --verify-no-changes --no-restore
      - name: Build
        # Warnings are errors, also those of the style rules. The agent of the
        # end-to-end tests is code too.
        working-directory: uno
        run: |
          dotnet build VfoxPlus.slnx --no-restore
          dotnet build src/VfoxPlus.App --no-restore -p:E2E=true
      - name: Test
        working-directory: uno
        run: |
          dotnet test tests/VfoxPlus.Tests --no-restore \
            --collect:"XPlat Code Coverage" --results-directory TestResults --settings tests/coverlet.runsettings
          python3 tools/coverage.py TestResults/*/coverage.cobertura.xml 90 \
            VfoxPlus.Core VfoxPlus.State VfoxPlus.Design VfoxPlus.Platform
      - name: Install vfox
        run: |
          archive="vfox_${VFOX_VERSION}_linux_x86_64"
          curl -fsSL --retry 5 -o "$RUNNER_TEMP/$archive.tar.gz" \
            "https://github.com/version-fox/vfox/releases/download/v$VFOX_VERSION/$archive.tar.gz"
          echo "$VFOX_SHA256  $RUNNER_TEMP/$archive.tar.gz" | sha256sum --check --strict -
          tar -xzf "$RUNNER_TEMP/$archive.tar.gz" -C "$RUNNER_TEMP"
          echo "VFOX_PLUS_E2E_VFOX=$RUNNER_TEMP/$archive/vfox" >> "$GITHUB_ENV"
      - name: Restore the packages of the release
        # The configurations restore different packages: a release build refuses
        # the Uno development server, which only Debug has.
        working-directory: uno
        run: dotnet restore src/VfoxPlus.App --runtime linux-x64 -p:Configuration=Release
      - name: Run the end-to-end scenarios in a virtual display
        env:
          # The "measure" scenario writes its numbers here for memory.yml.
          VFOX_PLUS_MEASURE_OUTPUT: ${{ runner.temp }}/memory/memory.txt
        run: |
          bash uno/tools/publish.sh --e2e "$RUNNER_TEMP/vfox-plus-e2e"
          for scenario in fake real measure; do
            xvfb-run -a -s "-screen 0 1280x800x24" dbus-run-session -- \
              bash web/e2e/run.sh "$scenario" "$RUNNER_TEMP/vfox-plus-e2e/VfoxPlus"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: memory-uno
          path: ${{ runner.temp }}/memory/memory.txt
          if-no-files-found: error
          overwrite: true
      - name: Publish the release
        run: bash uno/tools/publish.sh uno/build/stage
      - name: Build the .deb and the tarball
        run: |
          # Reproducible timestamps in the package metadata.
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" bash shared/packaging/linux/build-deb.sh \
            --package vfox-plus-uno --version "$(tr -d '[:space:]' < uno/VERSION)" \
            --stage uno/build/stage --executable VfoxPlus --technology "Uno Platform" --strip \
            --depends "$(sed -n 's/^DEPENDS="\(.*\)"$/\1/p' uno/sandbox/run-task.sh)" \
            --recommends "$(sed -n 's/^RECOMMENDS="\(.*\)"$/\1/p' uno/sandbox/run-task.sh)" \
            --override "embedded-library freetype [usr/lib/vfox-plus/libSkiaSharp.so]" \
            --override "embedded-library libjpeg [usr/lib/vfox-plus/libSkiaSharp.so]" \
            --override "embedded-library libpng [usr/lib/vfox-plus/libSkiaSharp.so]" \
            --override "embedded-library zlib [usr/lib/vfox-plus/libSystem.IO.Compression.Native.so]" \
            --notice uno/build/stage/Assets/Generated/licenses.txt dist
      - name: Smoke test the packaged files
        run: |
          mkdir "$RUNNER_TEMP/installed"
          dpkg-deb --extract dist/*.deb "$RUNNER_TEMP/installed"
          binary="$RUNNER_TEMP/installed/usr/lib/vfox-plus/VfoxPlus"
          xvfb-run -a -s "-screen 0 1280x800x24" dbus-run-session -- "$binary" > app.log 2>&1 &
          sleep 15
          if ! pgrep -f "^$binary" > /dev/null; then
            cat app.log
            echo "::error::vfox+ exited during startup"
            exit 1
          fi
          pkill -f "^$binary"
      - name: Validate the packages
        run: |
          desktop-file-validate shared/packaging/linux/dev.vfox.VfoxPlus.desktop
          # CI packages carry a placeholder maintainer; releases set DEB_MAINTAINER.
          lintian --fail-on error --suppress-tags malformed-contact,bogus-mail-host-in-debian-changelog dist/*.deb
      - name: Install the .deb into a clean Ubuntu container
        # The application must start with nothing but the declared dependencies.
        run: |
          docker run --rm --init \
            --volume "$PWD/shared/sandbox/task-lib.sh:/task-lib.sh:ro" \
            --volume "$PWD/uno/sandbox/run-task.sh:/run-task.sh:ro" \
            --volume "$PWD/dist:/pkg:ro" \
            --env TASK_LIB=/task-lib.sh \
            ubuntu:26.04 bash /run-task.sh install-test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vfox-plus-uno-linux-x64
          path: dist/*
          if-no-files-found: error
