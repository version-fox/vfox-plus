# The web front end of the Tauri and Wails implementations: formatting, lint,
# type checking, unit tests with coverage and the production builds.
# web/sandbox/run-task.sh runs the same steps locally; keep them in sync. The
# end-to-end tests run in the applications, in tauri.yml and wails.yml.
name: Web

on:
  push:
    branches: [main]
    paths:
      - web/**
      - shared/**
      - .github/workflows/web.yml
  pull_request:
    paths:
      - web/**
      - shared/**
      - .github/workflows/web.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: web

jobs:
  check:
    name: Format, lint, type check, test and build
    # Forks do not run CI.
    if: github.repository == 'version-fox/vfox-plus'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the pinned versions
        run: grep -E '^[A-Z0-9_]+=' versions.env >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install the font tools
        uses: ./.github/actions/install-linux-packages
        with:
          packages: fonttools python3-brotli
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/material-symbols
          key: material-symbols-${{ hashFiles('shared/tools/icon_font.py') }}
      - name: Download the Material Symbols font
        run: |
          python3 ../shared/tools/icon_font.py download ~/.cache/material-symbols
          echo "VFOX_PLUS_SYMBOLS=$HOME/.cache/material-symbols" >> "$GITHUB_ENV"
      - name: Install the packages
        run: npm ci
      - name: Generate the icon font and the license list
        run: npm run assets
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Test with the coverage gate
        run: npm run test:coverage
      - name: Build for Tauri and Wails
        run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: web-coverage
          path: web/coverage/lcov.info
          if-no-files-found: ignore
