# For the repositories of vfox plugins: check the profile that a plugin ships,
# lib/vfox-plus.json (docs/en/dev/profiles.md), against the plugin, with the
# reader of vfox plus. A plugin repository calls it with
#
#   jobs:
#     profile:
#       uses: version-fox/vfox-plus/.github/workflows/profile-lint.yml@main
name: Profile lint

on:
  workflow_call:
    inputs:
      plugin-directory:
        description: The directory of the plugin in the repository that calls
        type: string
        default: .
      vfox-plus-ref:
        description: The ref of version-fox/vfox-plus whose reader checks the profile
        type: string
        default: main

permissions:
  contents: read

jobs:
  lint:
    name: Check the profile of the plugin
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: plugin
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: version-fox/vfox-plus
          ref: ${{ inputs.vfox-plus-ref }}
          path: vfox-plus
          persist-credentials: false
      - name: Read the pinned versions
        run: grep -hE '^[A-Z0-9_]+=' vfox-plus/mygo/versions.env >> "$GITHUB_ENV"
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Check lib/vfox-plus.json
        env:
          PLUGIN_DIRECTORY: ${{ inputs.plugin-directory }}
        run: >-
          go -C "$GITHUB_WORKSPACE/vfox-plus/shared/tooling" run ./cmd/vfxtool profile lint
          --root "$GITHUB_WORKSPACE/vfox-plus/mygo"
          --plugin "$GITHUB_WORKSPACE/plugin/$PLUGIN_DIRECTORY"
