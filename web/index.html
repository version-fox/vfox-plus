<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' ipc: http://ipc.localhost wails: ws://127.0.0.1:* ws://localhost:*; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'"
    />
    <title>vfox+</title>
    <link rel="stylesheet" href="./src/document.css" />
  </head>
  <body>
    <!-- Directly beneath the body, the theme reaches everything, including snack bars. -->
    <m3e-theme color="#f28c1b" variant="tonal-spot" motion="expressive">
      <vfox-plus-app></vfox-plus-app>
    </m3e-theme>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
