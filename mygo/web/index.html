<script>
/* In the Android app (WebBridge.kt) the page keeps clear of the system bars by the insets that the app reports: top, right, bottom,
   left and the height of the keyboard, in CSS pixels. The app calls window.vfoxInsets again whenever they change. */
(function () {
  var bridge = window.vfoxAndroid;
  if (!bridge) return;
  window.vfoxInsets = function () {
    var v = String(bridge.insets()).split(","), root = document.documentElement;
    ["top", "right", "bottom", "left"].forEach(function (side, i) { root.style.setProperty("--sai-" + side, (parseFloat(v[i]) || 0) + "px"); });
    root.classList.toggle("kb", (parseFloat(v[4]) || 0) > 0);
  };
  window.vfoxInsets();
})();
</script>
