<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>vfox-plus</title>
<!--favicon-->
<link rel="manifest" href="/manifest.webmanifest">
<script type="module" src="/src/main.ts"></script>
</head>
<body>
<div class="app">
<aside class="rail" id="rail" aria-label="Navigation">
  <div class="brand"><img class="mark" src="<!--logo-->" width="44" height="44" alt=""><div class="wordmark">vfox-plus</div></div>
  <button class="iconbtn" id="railToggle" title="Menu" aria-expanded="false"><svg class="ic"><use href="#i-menu"/></svg></button>
  <button class="fab" id="fabAdd"><svg class="ic"><use href="#i-add"/></svg><span>Add</span></button>
  <nav id="railNav">
    <button class="dest" data-tab="home"><span class="pill"><svg class="ic line"><use href="#i-home"/></svg><svg class="ic fill"><use href="#i-home-fill"/></svg></span><span class="lbl">Home</span></button>
    <button class="dest" data-tab="sdks"><span class="pill"><svg class="ic line"><use href="#i-deployed-code"/></svg><svg class="ic fill"><use href="#i-deployed-code-fill"/></svg></span><span class="lbl">SDKs</span></button>
    <button class="dest" data-tab="plugins"><span class="pill"><svg class="ic line"><use href="#i-extension"/></svg><svg class="ic fill"><use href="#i-extension-fill"/></svg></span><span class="lbl">Plugins</span></button>
    <button class="dest" data-tab="tasks"><span class="pill"><svg class="ic line"><use href="#i-pending-actions"/></svg><svg class="ic fill"><use href="#i-pending-actions-fill"/></svg></span><span class="lbl">Tasks</span><span class="bdg" id="taskCount" hidden></span></button>
    <button class="dest" data-tab="settings"><span class="pill"><svg class="ic line"><use href="#i-settings"/></svg><svg class="ic fill"><use href="#i-settings-fill"/></svg></span><span class="lbl">Settings</span></button>
  </nav>
</aside>
<div style="flex:1;min-width:0;display:flex;flex-direction:column">
<header class="topbar">
  <h1 id="pageTitle">vfox-plus</h1>
</header>
<div class="offline" id="offline" role="status" hidden><svg class="ic sm"><use href="#i-hourglass-empty"/></svg><span id="offlineText">Reconnecting…</span></div>
<main>
  <section class="page" id="tab-home">
    <div class="pagehead homehead">
      <div class="grow">
        <h1 class="pagetitle" id="homeTitle">vfox+</h1>
        <div class="muted t-body" id="homeSub"></div>
      </div>
      <button class="iconbtn" id="homeRefresh" title="Refresh"><svg class="ic"><use href="#i-refresh"/></svg></button>
    </div>
    <div class="sectionlabel" id="h-active">In use</div>
    <div class="list grouped" id="homeActive"></div>
    <div class="sectionlabel" id="h-doctor">Health</div>
    <div class="list grouped" id="homeDoctor"></div>
    <div class="shellcard" id="shellCard" hidden>
      <div class="shellhead"><svg class="ic"><use href="#i-terminal"/></svg><h2 class="t-title-m" id="h-shell">Use the versions in a terminal</h2></div>
      <div class="seg" id="shellSeg" role="group" aria-labelledby="h-shell"></div>
      <p class="t-body muted" id="shellBody"></p>
      <div class="shell">
        <code id="shellCmd"></code>
        <button class="iconbtn sm" id="shellCopy" title="Copy"><svg class="ic sm"><use href="#i-content-copy"/></svg></button>
      </div>
      <a class="btn text" id="shellScript" target="_blank" rel="noopener noreferrer" hidden><svg class="ic sm"><use href="#i-open-in-new"/></svg><span id="shellScriptLabel">Get clink_vfox.lua</span></a>
    </div>
  </section>
  <section class="page" id="tab-sdks">
    <div class="pagehead">
      <h1 class="pagetitle" id="h-installed">SDKs</h1>
      <span class="sp"></span>
      <button class="iconbtn" id="sdkRefresh" title="Refresh"><svg class="ic"><use href="#i-refresh"/></svg></button>
    </div>
    <div class="sdk-grid" id="sdkGrid">
      <div class="pane pane-list">
        <div class="search"><svg class="ic sm muted"><use href="#i-search"/></svg><input id="sdkSearch" placeholder="Search…"></div>
        <div class="list" id="sdkList"></div>
      </div>
      <div class="pane pane-detail"><div id="sdkDetail"></div></div>
    </div>
  </section>
  <section class="page" id="tab-plugins">
    <div class="pagehead">
      <div class="grow"><h1 class="pagetitle" id="h-add">Plugins</h1></div>
      <button class="btn text" id="updateAllBtn"><svg class="ic sm"><use href="#i-update"/></svg><span>Update all</span></button>
      <button class="iconbtn" id="regRefresh" title="Refresh"><svg class="ic"><use href="#i-refresh"/></svg></button>
      <button class="btn tonal" id="addPluginBtn"><svg class="ic sm"><use href="#i-add"/></svg><span id="addPluginLabel">Add from source</span></button>
    </div>
    <div class="row searchrow">
      <div class="search grow"><svg class="ic sm muted"><use href="#i-search"/></svg><input id="pluginSearch" placeholder="Search…"></div>
      <div class="seg" id="pluginFilter"><button data-f="all" aria-pressed="true">All</button><button data-f="official" aria-pressed="false">Official</button><button data-f="community" aria-pressed="false">Community</button></div>
    </div>
    <div class="grid-cards" id="pluginList"></div>
  </section>
  <section class="page" id="tab-tasks">
    <div class="pagehead">
      <h1 class="pagetitle" id="h-tasks">Tasks</h1>
      <span class="sp"></span>
      <button class="btn text" id="clearBtn"><svg class="ic sm"><use href="#i-check-circle"/></svg><span>Clear finished</span></button>
    </div>
    <div class="list grouped" id="taskList"></div>
  </section>
  <section class="page" id="tab-settings">
    <h1 class="pagetitle" id="h-settings">Settings</h1>
    <div class="sectionlabel" id="h-web">Connections</div>
    <div class="pane" id="webCard"><div class="list" id="webList"></div><div class="pairbox" id="pairBox" hidden></div></div>
    <div class="sectionlabel" id="h-gui">Application</div>
    <div class="pane">
      <div class="rowitem"><span class="icon-tile"><svg class="ic"><use href="#i-terminal"/></svg></span><span class="grow"><span class="t-title-m" id="l-vfox">vfox executable</span><input id="setVfox" class="mono" size="30"></span><button id="saveVfox" class="btn tonal">Save</button></div>
      <div class="rowitem"><span class="icon-tile"><svg class="ic"><use href="#i-translate"/></svg></span><div class="grow stack"><span class="t-title-m" id="l-lang">Application language</span><div class="seg" id="langSeg" role="group" aria-labelledby="l-lang"><button data-l="system">system</button><button data-l="english">english</button><button data-l="simplifiedChinese">简体中文</button></div></div></div>
      <div class="rowitem"><span class="icon-tile"><svg class="ic"><use href="#i-language"/></svg></span><div class="grow stack"><span class="t-title-m" id="l-pageLang">Page language</span><div class="seg" id="pageLangSeg" role="group" aria-labelledby="l-pageLang"><button data-l="system">system</button><button data-l="en">English</button><button data-l="zh">简体中文</button></div></div></div>
      <div class="rowitem col"><span class="row"><span class="icon-tile"><svg class="ic"><use href="#i-data-object"/></svg></span><span class="t-title-m" id="l-env">Extra environment</span></span><textarea id="setEnv" rows="3" placeholder="KEY=value"></textarea><div><button id="saveEnv" class="btn tonal">Save</button></div></div>
    </div>
    <div class="sectionlabel" id="h-config">vfox config</div>
    <div class="pane"><div class="list" id="configList"></div></div>
  </section>
</main>
</div>
</div>

  <button class="dest" data-tab="sdks"><span class="pill"><svg class="ic line"><use href="#i-deployed-code"/></svg><svg class="ic fill"><use href="#i-deployed-code-fill"/></svg></span><span class="lbl">SDKs</span></button>
