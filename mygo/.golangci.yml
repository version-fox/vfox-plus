# Lint and formatting of the Go code. CI fails on any finding:
#
#   golangci-lint fmt --diff
#   golangci-lint run
version: "2"

linters:
  default: standard
  enable:
    - errorlint
    - gosec
    - misspell
    - revive
    - unconvert
    - unparam
  settings:
    revive:
      rules:
        # The types and functions of core use the domain names of this
        # document (VfoxCommand, SettingsStore, ...); the stutter is intended.
        - name: exported
          arguments:
            - disableStutteringCheck
        - name: package-comments
        - name: var-naming
        - name: indent-error-flow
        - name: error-strings
        - name: receiver-naming

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/version-fox/vfox-plus
