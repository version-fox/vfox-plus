*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--m3-surface);color:var(--m3-on-surface);font:400 14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--m3-on-surface);background:var(--m3-surface-container-highest);border:1px solid var(--m3-outline-variant);border-radius:12px;padding:10px 14px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--m3-primary);outline-offset:2px}
a{color:var(--m3-primary)}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
.ic{width:24px;height:24px;flex:none;fill:currentColor;display:inline-block;vertical-align:middle}
.ic.sm{width:20px;height:20px}
/* ---------- type scale (M3 Expressive, emphasized titles) ---------- */
.t-display{font-size:45px;line-height:1.15;font-weight:500;letter-spacing:-.25px}
.t-headline{font-size:28px;line-height:1.2;font-weight:500}
.t-title-l{font-size:22px;line-height:1.25;font-weight:500}
.t-title-l code{font-size:inherit}
.t-title-m{font-size:16px;line-height:1.4;font-weight:700}
.t-title-s{font-size:14px;line-height:1.4;font-weight:700}
.t-body{font-size:14px;line-height:1.5;font-weight:400}
.t-label{font-size:12px;line-height:1.35;font-weight:500}
.muted{color:var(--m3-on-surface-variant)}
/* ---------- app frame ---------- */
.app{display:flex;min-height:100vh}
/* nav rail: 96 collapsed, 240 expanded */
.rail{position:sticky;top:0;height:100vh;width:calc(96px + var(--sai-left));flex:none;display:flex;flex-direction:column;align-items:stretch;gap:4px;padding:calc(16px + var(--sai-top)) 12px calc(16px + var(--sai-bottom)) calc(12px + var(--sai-left));background:var(--m3-surface-container-low);transition:width var(--sp-default-spatial-t) var(--sp-default-spatial)}
.rail.expanded{width:calc(240px + var(--sai-left))}
.rail .brand{display:flex;align-items:center;gap:12px;padding:4px 8px 12px}
.rail .mark{width:44px;height:44px;flex:none;display:block}
.rail .wordmark{display:none;font-size:16px;font-weight:500;white-space:nowrap}

  .mfab span:last-child{display:none}
  .mfab{padding:0 16px}
  .mfab:active{border-radius:28px}
  body[data-tab=home] .mfab,body[data-tab=sdks] .mfab{display:inline-flex}
  /* flat content: lists and panes sit directly on the surface, no card in a card */
  .pane,.card{background:none;padding:0;border-radius:0;margin-bottom:20px}
  .pane-list{padding:0}
  .card.row,.row .card{background:none}
  .t-title-m{font-size:14px;font-weight:500;color:var(--m3-primary);letter-spacing:.1px;margin:4px 4px 8px}
  .list .item{padding:14px 16px}
  /* sdk detail: the avatar and the name make one headline, and the version goes under it */
  .avatar.lg{width:56px;height:56px;font-size:24px}
  #sdkDetail .t-title-l{display:block}
  /* fields take the width of the screen instead of their size= */
  .row>input:not([type=file]){flex:1 1 200px;min-width:0}
  .row>input[type=file],textarea{width:100%}
  /* home: version line instead of a hero card, tiles in one row */
  #homeTitle{display:none}
  #tab-home>.pane{display:flex;align-items:center;gap:8px;margin-bottom:12px}
  #tab-home>.pane>.row{margin:0 0 0 auto!important}
  #homeSub{font-size:14px}
  /* terminal hint and cards: tonal containers where there is content to group */
  #snacks{bottom:calc(176px + var(--sai-bottom))}
  #error{bottom:calc(176px + var(--sai-bottom))}
  /* the keyboard is open (the Android app says so): the bars make room for the field */
  html.kb .navbar,html.kb .mfab{display:none}
  html.kb main{padding-bottom:16px}
  html.kb #snacks,html.kb #error{bottom:16px}
  .scrim{align-items:flex-end;padding:0}
  .scrim .dialog{max-width:none;border-radius:28px 28px 0 0;padding:24px 24px calc(24px + var(--sai-bottom))}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}


/* ---------- the desktop's layout, at web widths ---------- */
/* A page names itself once. The top bar keeps the page name on phones only,
   where the content's own title is hidden to save the row. */
@media (min-width:701px){
  .topbar h1{display:none}
  .topbar{justify-content:flex-end}
}
.pagetitle{font-size:28px;line-height:36px;font-weight:500;margin:0 0 12px}
.pagehead{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.pagehead .sp{flex:1}
.pagehead .pagetitle{margin:0}
.pagehead .grow{min-width:0}
.pagehead .muted{margin-top:2px}
.sectionlabel{font-size:12px;font-weight:500;color:var(--m3-primary);margin:16px 4px 6px}
.grow{flex:1;min-width:0}
.hero .t-title-l{line-height:1.2}
.hero .row{align-items:flex-start}
.seal{display:inline-flex;align-items:center;color:var(--m3-primary)}
.taskrow:first-child{border-radius:20px 20px 4px 4px}
.taskrow:last-child{border-radius:4px 4px 20px 20px}
.taskrow:only-of-type{border-radius:20px}
.taskrow+.tasklog:last-child{border-radius:0 0 20px 20px}
.icon-tile{width:40px;height:40px;flex:none;display:inline-flex;align-items:center;justify-content:center;border-radius:12px;background:var(--m3-secondary-container);color:var(--m3-on-secondary-container)}
.icon-tile .ic{width:22px;height:22px}
.pane>.row:first-child{margin-bottom:6px}
.shell{display:flex;align-items:center;gap:12px;background:var(--m3-surface-container-low);border-radius:20px;padding:10px 10px 10px 12px;margin-top:12px}
.shell code{flex:1;min-width:0;overflow-wrap:anywhere}
.shell .iconbtn{flex:none}
.shell .iconbtn:active{background:var(--m3-surface-container-high)}
.list .item:active{background:var(--m3-surface-container-high)}
.spin{animation:spin var(--sp-default-spatial-t) var(--sp-default-spatial)}
.filterline{display:flex;align-items:center;gap:12px;margin:8px 4px 8px;min-height:32px}
.filterline #vChips{flex:1;min-width:0;margin:0}
.filterline #vCount{margin-left:auto;white-space:nowrap}
.searchrow{align-items:center;gap:12px}
.searchrow .search{margin:0}
.rowitem{display:flex;align-items:center;gap:14px;padding:10px 0;border-bottom:1px solid var(--m3-outline-variant)}
.rowitem:last-child{border-bottom:0}
.rowitem .grow{display:flex;flex-direction:column;gap:6px}
.rowitem.col{flex-direction:column;align-items:stretch}
.rowitem.col .row{gap:14px;align-items:center}
.rowitem textarea{width:100%}
.rowitem code,.pane code{overflow-wrap:anywhere}
.rowitem input.mono{width:100%}
/* segmented buttons: the choice is the filled one, as in the desktop */
.seg button[aria-pressed="true"]{background:var(--m3-primary);color:var(--m3-on-primary)}
.pcard{justify-content:space-between}
.pcard .lead{display:flex;align-items:center;gap:12px;min-width:0}
.pcard .lead .avatar{width:40px;height:40px;font-size:16px}
.pcard .lead .names{min-width:0;display:flex;flex-direction:column}
.pcard .lead .names b{font-weight:500}
.pcard .lead .names .nameline{display:flex;align-items:center;gap:6px}
.pcard .lead .names .muted{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard .actions{display:flex;align-items:center;gap:8px;margin-top:10px}
.pcard .actions .grow{flex:1}
.btn.tonal{background:var(--m3-secondary-container);color:var(--m3-on-secondary-container);border-radius:999px;min-height:40px}
.btn.tonal:hover{background:color-mix(in srgb,var(--m3-on-secondary-container) 8%,var(--m3-secondary-container))}
/* task rows */
.taskrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 16px;background:var(--m3-surface-container)}
.taskrow .grow{display:flex;flex-direction:column;gap:2px}
.taskrow .muted{font-size:12px}
.taskrow[aria-expanded="true"]{border-radius:20px}
.tasklog{padding:0 16px 14px;background:var(--m3-surface-container);border-radius:0 0 20px 20px}
/* config rows */
.confrow{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--m3-surface-container)}
.confrow .grow{min-width:0;display:flex;flex-direction:column;gap:2px}
.confrow .muted{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* page switch: shared axis, as the desktop between destinations */
@keyframes sharedAxisPage{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.page.enter{animation:sharedAxisPage var(--sp-default-spatial-t) var(--sp-default-spatial)}
@media (max-width:700px){
  .pagetitle{display:none}
  .pagehead{margin-bottom:8px}
  .pagehead .grow .t-body{display:none}
  .sectionlabel{margin:12px 4px 4px}
  .rowitem{flex-wrap:wrap}
}
/* ---------- phones: one column, the page title lives in the top bar ---------- */
@media (max-width:700px){
  #tab-home>.pane{display:block}
  #tab-home>.pane .row{margin:0!important}
  .hero{padding:0 0 6px!important}
  .hero .grow{display:flex;align-items:center;gap:10px;min-height:36px}
  .hero .t-title-l{display:none}
  .hero .iconbtn{margin-left:auto}
  .list .item{padding:14px 14px}
  .pagehead{gap:6px;justify-content:flex-end;margin:0 0 4px}
  .pagehead .grow{display:none}
  .pagehead .iconbtn{width:36px;height:36px}
  .pagehead .btn{min-height:36px;padding:0 12px}
  .searchrow{flex-direction:column;align-items:stretch;gap:8px}
  .searchrow .seg{align-self:flex-start}
  .rowitem{padding:12px 0}
  /* the label of a row starts where the control of the row starts; the margin of .t-title-m on a phone is for a heading */
  .rowitem .t-title-m{margin:0}
}
@media (max-width:700px){
  /* the bar already has the plugins destination; the floating button only ate the corner */
  .mfab{display:none!important}
  main{padding-bottom:calc(104px + var(--sai-bottom))}
}

/* The pairing box: the code first, the link and the fingerprint folded away */
.pairbox .qr{max-width:240px}
.pairbox .tech{margin-top:4px;font-size:12px;color:var(--m3-on-surface-variant);max-width:100%}
.pairbox .tech summary{cursor:pointer;font-weight:500;color:var(--m3-primary);padding:4px 0}
.pairbox .tech code{display:block;overflow-wrap:anywhere;margin:4px 0 8px}
.pairbox .tech p{margin:0}</style>
</head>
