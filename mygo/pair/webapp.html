<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>vfox-plus</title>
<!--favicon-->
<link rel="manifest" href="/manifest.webmanifest">
<style>
:root[data-theme=light] {
  --m3-background: #fff8f5;
  --m3-on-background: #221a14;
  --m3-surface: #fff8f5;
  --m3-surface-dim: #e6d7cd;
  --m3-surface-bright: #fff8f5;
  --m3-surface-container-lowest: #ffffff;
  --m3-surface-container-low: #fff1e8;
  --m3-surface-container: #fbebe1;
  --m3-surface-container-high: #f5e5db;
  --m3-surface-container-highest: #efe0d6;
  --m3-on-surface: #221a14;
  --m3-on-surface-variant: #51443b;
  --m3-outline: #837469;
  --m3-outline-variant: #d6c3b6;
  --m3-inverse-surface: #372f28;
  --m3-inverse-on-surface: #feeee4;
  --m3-primary: #88521c;
  --m3-on-primary: #ffffff;
  --m3-primary-container: #ffdcc1;
  --m3-on-primary-container: #6b3b04;
  --m3-primary-fixed: #ffdcc1;
  --m3-primary-fixed-dim: #ffb779;
  --m3-on-primary-fixed: #2e1500;
  --m3-on-primary-fixed-variant: #6b3b04;
  --m3-inverse-primary: #ffb779;
  --m3-secondary: #745943;
  --m3-on-secondary: #ffffff;
  --m3-secondary-container: #ffdcc1;
  --m3-on-secondary-container: #5a422e;
  --m3-secondary-fixed: #ffdcc1;
  --m3-secondary-fixed-dim: #e3c0a5;
  --m3-on-secondary-fixed: #2a1707;
  --m3-on-secondary-fixed-variant: #5a422e;
  --m3-tertiary: #5b6237;
  --m3-on-tertiary: #ffffff;
  --m3-tertiary-container: #e0e7b1;
  --m3-on-tertiary-container: #434a22;
  --m3-tertiary-fixed: #e0e7b1;
  --m3-tertiary-fixed-dim: #c3cb97;
  --m3-on-tertiary-fixed: #181e00;
  --m3-on-tertiary-fixed-variant: #434a22;
  --m3-error: #ba1a1a;
  --m3-on-error: #ffffff;
  --m3-error-container: #ffdad6;
  --m3-on-error-container: #93000a;
  --m3-surface-variant: #f3dfd1;
  --m3-shadow: #000000;
  --m3-scrim: #000000;
}
:root[data-theme=dark] {
  --m3-background: #19120c;
  --m3-on-background: #efe0d6;
  --m3-surface: #19120c;
  --m3-surface-dim: #19120c;
  --m3-surface-bright: #413731;
  --m3-surface-container-lowest: #140d08;
  --m3-surface-container-low: #221a14;
  --m3-surface-container: #261e18;
  --m3-surface-container-high: #312822;
  --m3-surface-container-highest: #3c332c;
  --m3-on-surface: #efe0d6;
  --m3-on-surface-variant: #d6c3b6;
  --m3-outline: #9e8e82;
  --m3-outline-variant: #51443b;
  --m3-inverse-surface: #efe0d6;
  --m3-inverse-on-surface: #372f28;
  --m3-primary: #ffb779;
  --m3-on-primary: #4c2700;
  --m3-primary-container: #6b3b04;
  --m3-on-primary-container: #ffdcc1;
  --m3-primary-fixed: #ffdcc1;
  --m3-primary-fixed-dim: #ffb779;
  --m3-on-primary-fixed: #2e1500;
  --m3-on-primary-fixed-variant: #6b3b04;
  --m3-inverse-primary: #88521c;
  --m3-secondary: #e3c0a5;
  --m3-on-secondary: #412c19;
  --m3-secondary-container: #5a422e;
  --m3-on-secondary-container: #ffdcc1;
  --m3-secondary-fixed: #ffdcc1;
  --m3-secondary-fixed-dim: #e3c0a5;
  --m3-on-secondary-fixed: #2a1707;
  --m3-on-secondary-fixed-variant: #5a422e;
  --m3-tertiary: #c3cb97;
  --m3-on-tertiary: #2d330e;
  --m3-tertiary-container: #434a22;
  --m3-on-tertiary-container: #e0e7b1;
  --m3-tertiary-fixed: #e0e7b1;
  --m3-tertiary-fixed-dim: #c3cb97;
  --m3-on-tertiary-fixed: #181e00;
  --m3-on-tertiary-fixed-variant: #434a22;
  --m3-error: #ffb4ab;
  --m3-on-error: #690005;
  --m3-error-container: #93000a;
  --m3-on-error-container: #ffdad6;
  --m3-surface-variant: #51443b;
  --m3-shadow: #000000;
  --m3-scrim: #000000;
}

:root{color-scheme:light dark}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--m3-surface);color:var(--m3-on-surface);font:400 14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--m3-on-surface);background:var(--m3-surface-container-highest);border:1px solid var(--m3-outline-variant);border-radius:12px;padding:10px 14px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--m3-primary);outline-offset:2px}
a{color:var(--m3-primary)}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
.ic{width:24px;height:24px;flex:none;fill:currentColor;display:inline-block;vertical-align:middle}
.ic.sm{width:20px;height:20px}
/* ---------- type scale (M3 Expressive, emphasized titles) ---------- */
.t-display{font-size:45px;line-height:1.15;font-weight:500;letter-spacing:-.25px}
.t-headline{font-size:28px;line-height:1.2;font-weight:500}
.t-title-l{font-size:22px;line-height:1.25;font-weight:500}
.t-title-m{font-size:16px;line-height:1.4;font-weight:700}
.t-title-s{font-size:14px;line-height:1.4;font-weight:700}
.t-body{font-size:14px;line-height:1.5;font-weight:400}
.t-label{font-size:12px;line-height:1.35;font-weight:500}
.muted{color:var(--m3-on-surface-variant)}
/* ---------- app frame ---------- */
.app{display:flex;min-height:100vh}
/* nav rail: 96 collapsed, 240 expanded */
.rail{position:sticky;top:0;height:100vh;width:96px;flex:none;display:flex;flex-direction:column;align-items:stretch;gap:4px;padding:16px 12px;background:var(--m3-surface-container-low);transition:width .35s cubic-bezier(.34,1.2,.64,1)}
.rail.expanded{width:240px}
.rail .brand{display:flex;align-items:center;gap:12px;padding:4px 8px 12px}
.rail .mark{width:44px;height:44px;flex:none;display:block}
.rail .wordmark{display:none;font-size:18px;font-weight:500;white-space:nowrap}
.rail.expanded .wordmark{display:block}
.rail .iconbtn{align-self:flex-start}
.rail nav{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.dest{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0 8px;border-radius:16px;color:var(--m3-on-surface-variant);min-height:64px;justify-content:center}
.rail.expanded .dest{flex-direction:row;justify-content:flex-start;gap:12px;padding:0 16px 0 0;min-height:56px;border-radius:28px}
.dest .pill{position:relative;display:flex;align-items:center;justify-content:center;width:56px;height:32px;border-radius:16px;transition:background-color .25s,border-radius .25s cubic-bezier(.34,1.3,.64,1)}
.rail.expanded .dest .pill{width:56px}
.dest .pill .ic{position:absolute;transition:opacity .2s}
.dest .pill .fill{opacity:0}
.dest[aria-current="true"]{color:var(--m3-on-surface)}
.dest[aria-current="true"] .pill{background:var(--m3-secondary-container);color:var(--m3-on-secondary-container)}
.dest[aria-current="true"] .pill .fill{opacity:1}
.dest[aria-current="true"] .pill .line{opacity:0}
.dest:active .pill{border-radius:8px}
.dest .lbl{font-size:12px;font-weight:500;line-height:1.2}
.rail.expanded .dest .lbl{font-size:14px}
.dest .bdg{position:absolute;top:2px;right:calc(50% - 22px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--m3-error);color:var(--m3-on-error);font-size:11px;font-weight:500;display:flex;align-items:center;justify-content:center}
.dest .bdg[hidden]{display:none}
.rail.expanded .dest .bdg{right:8px;top:calc(50% - 9px)}
.rail .fab{margin-top:auto;align-self:center;display:flex;align-items:center;gap:8px;height:56px;min-width:56px;padding:0 16px;border-radius:16px;background:var(--m3-primary-container);color:var(--m3-on-primary-container);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:border-radius .3s cubic-bezier(.34,1.3,.64,1)}
.rail .fab:hover{border-radius:20px}
.rail .fab span:last-child{display:none}
.rail.expanded .fab span:last-child{display:inline;font-weight:500}
.rail.expanded .fab,.rail.expanded .iconbtn{align-self:flex-start}
/* icon buttons: expressive sizes/shapes */
.iconbtn{position:relative;display:inline-flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:50%;color:var(--m3-on-surface-variant);transition:background-color .2s,border-radius .25s cubic-bezier(.34,1.3,.64,1)}
.iconbtn:hover{background:color-mix(in srgb,var(--m3-on-surface) 8%,transparent)}
.iconbtn:active{border-radius:12px}
.iconbtn.sm{width:40px;height:40px}
.iconbtn.toggled{color:var(--m3-primary)}
/* top bar */
.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:10px 20px;background:var(--m3-surface);border-bottom:1px solid var(--m3-outline-variant)}
.topbar h1{font-size:18px;font-weight:500;margin:0}
.topbar .sp{flex:1}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--m3-on-surface-variant)}
.live .dot{width:9px;height:9px;border-radius:50%;background:var(--m3-outline)}
.live.on .dot{background:#1a7f37}
@media (prefers-color-scheme:dark){.live.on .dot{background:#6fdc8c}}
.ver{font-size:12px;color:var(--m3-on-surface-variant)}
/* pages */
main{flex:1;min-width:0;padding:20px;max-width:1120px;margin:0 auto;width:100%}
.page{display:none}
.page.active{display:block}
.page.enter{animation:fadeThrough .28s cubic-bezier(.2,0,0,1)}
@keyframes fadeThrough{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:scale(1)}}
/* cards & panes: page panes on surface-container-low */
.card{background:var(--m3-surface-container-low);border-radius:16px;padding:16px;margin-bottom:12px}
.pane{background:var(--m3-surface-container-low);border-radius:28px;padding:20px}
.card h3,.pane h3{margin:0 0 8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
/* buttons: full at rest, 8dp corners while pressed */
.btn{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 20px;border-radius:20px;background:var(--m3-secondary-container);color:var(--m3-on-secondary-container);font-weight:500;transition:border-radius .25s cubic-bezier(.34,1.3,.64,1),background-color .2s}
.btn:hover{background:color-mix(in srgb,var(--m3-on-secondary-container) 8%,var(--m3-secondary-container))}
.btn:active{border-radius:8px}
.btn.primary{background:var(--m3-primary);color:var(--m3-on-primary)}
.btn.primary:hover{background:color-mix(in srgb,var(--m3-on-primary) 8%,var(--m3-primary))}
.btn.danger{background:transparent;color:var(--m3-error);border:1px solid var(--m3-outline-variant)}
.btn.text{background:transparent;color:var(--m3-primary);padding:0 12px}
.btn:disabled{opacity:.45;cursor:default}
/* segmented buttons */
.seg{display:inline-flex;background:var(--m3-surface-container-highest);border-radius:20px;padding:2px;gap:2px}
.seg button{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 16px;border-radius:18px;color:var(--m3-on-surface-variant);font-weight:500;transition:border-radius .25s,background-color .2s}
.seg button[aria-pressed="true"]{background:var(--m3-secondary-container);color:var(--m3-on-secondary-container);border-radius:18px}
.seg button:active{border-radius:8px}
/* search bar: full pill */
.search{display:flex;align-items:center;gap:8px;background:var(--m3-surface-container-highest);border-radius:28px;padding:4px 16px 4px 12px;margin-bottom:12px}
.search input{flex:1;background:none;border:0;padding:10px 0;outline:none;min-width:0}
/* segmented lists: 20 outer / 4 inner, inner grows to 12 on hover */
.list{display:flex;flex-direction:column}
.list .item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--m3-surface-container);padding:12px 16px;color:var(--m3-on-surface);transition:border-radius .25s cubic-bezier(.34,1.3,.64,1),background-color .2s}
.list .item:first-child{border-radius:20px 20px 4px 4px}
.list .item:last-child{border-radius:4px 4px 20px 20px}
.list .item:only-child{border-radius:20px}
.list .item:not(:first-child):not(:last-child){border-radius:4px}
.list .item:hover .inner,.list .item:hover{border-radius:12px}
.list .item[aria-current="true"]{background:var(--m3-secondary-container);color:var(--m3-on-secondary-container)}
/* plugin cards grid */
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
/* content-visibility: the cards below the screen are not laid out, so that opening the page takes one frame */
.pcard{background:var(--m3-surface-container);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:8px;content-visibility:auto;contain-intrinsic-size:auto 150px}
/* avatars: expressive shapes by hash, 3 tone pairs */
.avatar{width:48px;height:48px;flex:none;display:flex;align-items:center;justify-content:center;font-weight:500;font-size:20px;transition:transform .35s cubic-bezier(.34,1.3,.64,1)}
.avatar:hover{transform:rotate(30deg)}
.avatar.lg{width:72px;height:72px;font-size:30px}
.av-p{background:var(--m3-primary-fixed);color:var(--m3-on-primary-fixed)}
.av-s{background:var(--m3-secondary-fixed);color:var(--m3-on-secondary-fixed)}
.av-t{background:var(--m3-tertiary-fixed);color:var(--m3-on-tertiary-fixed)}
.av-0{border-radius:50% 38% 55% 45%/48% 55% 45% 52%}
.av-1{border-radius:38% 62% 42% 58%/58% 42% 58% 42%}
.av-2{border-radius:62% 38% 60% 40%/40% 60% 38% 62%}
.av-3{border-radius:45% 55% 38% 62%/62% 38% 62% 38%}
.av-4{border-radius:55% 45% 62% 38%/42% 58% 40% 60%}
.av-5{border-radius:42% 58% 48% 52%/55% 42% 58% 45%}
.av-6{border-radius:58% 42% 55% 45%/45% 52% 48% 55%}
.av-7{border-radius:40% 60% 45% 55%/52% 45% 60% 40%}
.av-8{border-radius:52% 48% 40% 60%/45% 55% 42% 58%}
.av-9{border-radius:48% 52% 58% 42%/58% 40% 55% 48%}
.av-10{border-radius:60% 40% 45% 55%/42% 58% 48% 52%}
.av-11{border-radius:45% 55% 52% 48%/50% 48% 52% 50%}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;padding:2px 10px;border-radius:8px;background:var(--m3-surface-container-highest);color:var(--m3-on-surface-variant)}
.tag.cur{background:var(--m3-primary);color:var(--m3-on-primary);border-radius:12px}
/* empty & error states: icon on large shape */
.state{display:flex;flex-direction:column;align-items:center;gap:8px;padding:36px 16px;text-align:center;color:var(--m3-on-surface-variant)}
.state .shape{width:96px;height:96px;display:flex;align-items:center;justify-content:center;background:var(--m3-secondary-container);color:var(--m3-on-secondary-container);border-radius:48% 52% 55% 45%/52% 45% 55% 48%}
.state .shape .ic{width:40px;height:40px}
.state.err .shape{background:var(--m3-error-container);color:var(--m3-on-error-container)}
.state h3{margin:8px 0 0;color:var(--m3-on-surface);font-size:16px;font-weight:700}
/* wavy progress: 4dp, primary on secondary-container, stop dot */
.wavy{position:relative;height:8px;border-radius:4px;background:var(--m3-secondary-container);overflow:hidden;min-width:120px}
.wavy .fill{position:absolute;inset:0 auto 0 0;width:calc(var(--p,0)*100%);overflow:hidden}
.wavy .fill svg{position:absolute;top:0;left:0;height:8px}
.wavy.ind .fill{width:40%;animation:slide 1.1s linear infinite}
/* transform, not left: the compositor moves it, so it runs at the display's rate */
@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
.wavy .stop{position:absolute;right:2px;top:3px;width:2px;height:2px;border-radius:1px;background:var(--m3-primary)}
/* loading indicator: morph + slow rotation */
.loader{width:48px;height:48px;margin:0 auto;animation:spin 4666ms linear infinite}
.loader .blob{width:100%;height:100%;background:var(--m3-primary);animation:morph 650ms ease-in-out infinite alternate}
@keyframes morph{from{border-radius:50% 38% 55% 45%/48% 55% 45% 52%}50%{border-radius:38% 62% 42% 58%/58% 42% 58% 42%}to{border-radius:20px}}
@keyframes spin{to{transform:rotate(360deg)}}
/* dialogs: scale spring + fade */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:30;padding:20px}
.scrim.open{display:flex}
.dialog{background:var(--m3-surface-container-high);border-radius:28px;padding:24px;max-width:440px;width:100%;box-shadow:0 8px 32px rgba(0,0,0,.3)}
.scrim.open .dialog{animation:pop .38s cubic-bezier(.3,1.4,.5,1)}
@keyframes pop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}
.dialog h3{margin:0 0 8px;font-size:20px;font-weight:500}
.dialog .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
/* menus */
.menu{position:fixed;z-index:40;background:var(--m3-surface-container-high);border-radius:12px;padding:8px 0;min-width:200px;box-shadow:0 4px 16px rgba(0,0,0,.3);display:none}
.menu.open{display:block;animation:pop .25s cubic-bezier(.3,1.4,.5,1)}
.menu button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 16px;border-radius:4px}
.menu button:hover{background:color-mix(in srgb,var(--m3-on-surface) 8%,transparent)}
.menu button.danger{color:var(--m3-error)}
/* snackbar */
#snacks{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:50;display:flex;flex-direction:column;gap:8px;align-items:center;max-width:92vw}
.snack{display:flex;align-items:center;gap:12px;background:var(--m3-inverse-surface);color:var(--m3-inverse-on-surface);border-radius:12px;padding:12px 16px;box-shadow:0 4px 16px rgba(0,0,0,.35);animation:rise .3s cubic-bezier(.2,0,0,1)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.snack button{color:var(--m3-inverse-primary);font-weight:500}
/* stat tiles: container colour + decorative shape */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:12px}
.stat{position:relative;overflow:hidden;border-radius:28px;padding:16px;min-height:110px}
.stat.s1{background:var(--m3-primary-container);color:var(--m3-on-primary-container)}
.stat.s2{background:var(--m3-secondary-container);color:var(--m3-on-secondary-container)}
.stat.s3{background:var(--m3-tertiary-container);color:var(--m3-on-tertiary-container)}
.stat .n{font-size:32px;font-weight:500;line-height:1.1}
.stat .shape{position:absolute;right:-30px;bottom:-30px;width:110px;height:110px;opacity:.35}
/* switch */
.switch{position:relative;width:52px;height:32px;flex:none;border-radius:16px;background:var(--m3-outline-variant);transition:background-color .2s}
.switch::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:var(--m3-on-surface-variant);transition:transform .25s cubic-bezier(.34,1.3,.64,1),background-color .2s}
.switch[aria-checked="true"]{background:var(--m3-primary)}
.switch[aria-checked="true"]::after{transform:translateX(20px);background:var(--m3-on-primary)}
/* fields */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.field label{font-size:12px;font-weight:500;color:var(--m3-on-surface-variant)}
/* table */
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--m3-outline-variant);vertical-align:middle}
pre.log{background:#111;color:#e8e8e8;border-radius:12px;padding:12px;max-height:320px;overflow:auto;white-space:pre-wrap;word-break:break-all}
@media (prefers-color-scheme:dark){pre.log{background:#000}}
.sdk-grid{display:grid;grid-template-columns:300px 1fr;gap:12px}
@keyframes sharedX{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
.navbar{display:none}
#error{position:fixed;left:50%;transform:translateX(-50%);bottom:88px;background:var(--m3-error);color:var(--m3-on-error);padding:10px 18px;border-radius:12px;display:none;max-width:88vw;z-index:60}
.mfab{display:none}
@media (max-width:700px){
  .rail{display:none}
  /* app bar: flat, large title, status as a dot only */
  .topbar{padding:12px 16px 4px;border-bottom:0;background:var(--m3-surface)}
  .topbar h1{font-size:28px;line-height:36px;font-weight:500}
  .live span:last-child,.ver{display:none}
  .live .dot{width:10px;height:10px}
  main{padding:8px 16px 168px}
  /* navigation bar: 80dp, pill indicator, labels always shown */
  .navbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--m3-surface-container);padding:12px 8px calc(16px + env(safe-area-inset-bottom));justify-content:space-around}
  .navbar .dest{min-height:56px;min-width:64px;padding:0}
  /* extended FAB above the bar on the pages where adding makes sense */
  .mfab{position:fixed;right:16px;bottom:calc(96px + env(safe-area-inset-bottom));z-index:9;display:none;align-items:center;gap:12px;height:56px;padding:0 20px 0 16px;border-radius:16px;background:var(--m3-primary-container);color:var(--m3-on-primary-container);font-weight:500;box-shadow:0 2px 8px rgba(0,0,0,.28);transition:border-radius .3s cubic-bezier(.34,1.3,.64,1)}
  .mfab span:last-child{display:none}
  .mfab{padding:0 16px}
  .mfab:active{border-radius:28px}
  body[data-tab=home] .mfab,body[data-tab=sdks] .mfab{display:inline-flex}
  /* flat content: lists and panes sit directly on the surface, no card in a card */
  .pane,.card{background:none;padding:0;border-radius:0;margin-bottom:20px}
  .pane-list{padding:0}
  .card.row,.row .card{background:none}
  .t-title-m{font-size:14px;font-weight:500;color:var(--m3-primary);letter-spacing:.1px;margin:4px 4px 8px}
  .list .item{padding:14px 16px}
  /* home: version line instead of a hero card, tiles in one row */
  #homeTitle{display:none}
  #tab-home>.pane{display:flex;align-items:center;gap:8px;margin-bottom:12px}
  #tab-home>.pane>.row{margin:0 0 0 auto!important}
  #homeSub{font-size:14px}
  .stats{grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:20px}
  .stat{min-height:0;padding:14px 12px 12px;border-radius:20px;display:flex;flex-direction:column;align-items:flex-start;gap:2px}
  .stat .shape{display:none}
  .stat .n{font-size:28px}
  .stat .l,.stat .lbl,.stat div:last-child{font-size:12px}
  /* terminal hint and cards: tonal containers where there is content to group */
  #tab-home .card:has(#shellCmd){background:var(--m3-surface-container-low);padding:16px;border-radius:20px}
  /* sdks: master/detail as two screens */
  .sdk-grid{grid-template-columns:1fr}
  .pane-detail{display:none}
  #tab-sdks.detail-open .pane-list{display:none}
  #tab-sdks.detail-open .pane-detail{display:block;animation:sharedX .3s cubic-bezier(.2,0,0,1)}
  #snacks{bottom:176px}
  #error{bottom:176px}
  .scrim{align-items:flex-end;padding:0}
  .scrim .dialog{max-width:none;border-radius:28px 28px 0 0;padding:24px 24px calc(24px + env(safe-area-inset-bottom))}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}

</style>
</head>
<body>
<div class="app">
<aside class="rail" id="rail" aria-label="Navigation">
  <div class="brand"><img class="mark" src="<!--logo-->" width="44" height="44" alt=""><div class="wordmark">vfox-plus</div></div>
  <button class="iconbtn" id="railToggle" title="Menu"><svg class="ic"><use href="#i-more-vert"/></svg></button>
  <nav id="railNav">
    <button class="dest" data-tab="home"><span class="pill"><svg class="ic line"><use href="#i-home"/></svg><svg class="ic fill"><use href="#i-home-fill"/></svg></span><span class="lbl">Home</span></button>
    <button class="dest" data-tab="sdks"><span class="pill"><svg class="ic line"><use href="#i-deployed-code"/></svg><svg class="ic fill"><use href="#i-deployed-code-fill"/></svg></span><span class="lbl">SDKs</span></button>
    <button class="dest" data-tab="plugins"><span class="pill"><svg class="ic line"><use href="#i-extension"/></svg><svg class="ic fill"><use href="#i-extension-fill"/></svg></span><span class="lbl">Plugins</span></button>
    <button class="dest" data-tab="tasks"><span class="pill"><svg class="ic line"><use href="#i-pending-actions"/></svg><svg class="ic fill"><use href="#i-pending-actions-fill"/></svg></span><span class="lbl">Tasks</span><span class="bdg" id="taskCount" hidden></span></button>
    <button class="dest" data-tab="settings"><span class="pill"><svg class="ic line"><use href="#i-settings"/></svg><svg class="ic fill"><use href="#i-settings"/></svg></span><span class="lbl">Settings</span></button>
  </nav>
  <button class="fab" id="fabAdd"><svg class="ic"><use href="#i-add"/></svg><span>Add</span></button>
</aside>
<div style="flex:1;min-width:0;display:flex;flex-direction:column">
<header class="topbar">
  <h1 id="pageTitle">vfox-plus</h1>
  <span class="sp"></span>
  <span class="live" id="live"><span class="dot" id="liveDot"></span><span id="liveText">…</span></span>
  <span class="ver" id="vfoxVer"></span>
  <button class="iconbtn sm" id="langBtn" title="EN/中文"><svg class="ic sm"><use href="#i-translate"/></svg></button>
</header>
<main>
  <section class="page" id="tab-home">
    <div class="pane">
      <div class="t-title-l" id="homeTitle">vfox-plus</div>
      <div class="muted t-body" id="homeSub"></div>
      <div class="row" style="margin-top:8px"><button class="btn text" id="homeRefresh"><svg class="ic sm"><use href="#i-refresh"/></svg><span>Refresh</span></button></div>
    </div>
    <div class="stats" id="homeStats"></div>
    <div class="card"><div class="t-title-m" id="h-active">In use</div><div class="list" id="homeActive"></div></div>
    <div class="card"><div class="t-title-m" id="h-shell">Use in a terminal</div><p class="muted t-body" id="shellBody"></p><div class="row"><code id="shellCmd">eval "$(vfox activate bash)"</code><button class="iconbtn sm" id="shellCopy" title="Copy"><svg class="ic sm"><use href="#i-content-copy"/></svg></button></div></div>
    <div class="row" style="gap:12px">
      <div class="card" style="flex:1;min-width:220px"><div class="t-title-m" id="h-explore">Explore</div><p class="muted t-body" id="exploreBody"></p><button class="btn" id="exploreBtn"><svg class="ic sm"><use href="#i-explore"/></svg><span>Plugins</span></button></div>
      <div class="card" style="flex:1;min-width:220px"><div class="t-title-m" id="h-docs">Docs</div><p class="muted t-body">vfox.dev</p><button class="btn" id="docsBtn"><svg class="ic sm"><use href="#i-menu-book"/></svg><span>vfox docs</span></button></div>
    </div>
  </section>
  <section class="page" id="tab-sdks">
    <div class="sdk-grid" id="sdkGrid">
      <div class="card pane-list"><div class="row"><div class="t-title-m" id="h-installed" style="flex:1">Installed</div><button class="iconbtn sm" id="sdkRefresh" title="Refresh"><svg class="ic sm"><use href="#i-refresh"/></svg></button></div>
        <div class="search"><svg class="ic sm muted"><use href="#i-search"/></svg><input id="sdkSearch" placeholder="Search…"></div>
        <div class="list" id="sdkList"></div>
      </div>
      <div class="card pane-detail"><div id="sdkDetail"><p class="muted" id="pickSdk">Pick an SDK.</p></div></div>
    </div>
  </section>
  <section class="page" id="tab-plugins">
    <div class="card"><div class="t-title-m" id="h-add">Add a plugin</div>
      <div class="row"><input id="addSource" size="30" placeholder="https://…"><input id="addAlias" size="10" placeholder="alias"><button id="addBtn" class="btn primary">Add</button></div>
      <div class="row" style="margin-top:8px"><input type="file" id="addFile" accept=".zip,.lua"><button id="uploadBtn" class="btn">Upload &amp; add</button></div>
    </div>
    <div class="card"><div class="row"><div class="t-title-m" id="h-registry" style="margin:0;flex:1">Registry</div><button class="btn text" id="updateAllBtn">Update all</button><button class="iconbtn sm" id="regRefresh" title="Refresh"><svg class="ic sm"><use href="#i-refresh"/></svg></button></div>
      <div class="search"><svg class="ic sm muted"><use href="#i-search"/></svg><input id="pluginSearch" placeholder="Search…"></div>
      <div class="seg" id="pluginFilter"><button data-f="all" aria-pressed="true">All</button><button data-f="official" aria-pressed="false">Official</button><button data-f="community" aria-pressed="false">Community</button></div>
      <div class="grid-cards" id="pluginList" style="margin-top:12px"></div>
    </div>
  </section>
  <section class="page" id="tab-tasks">
    <div class="card"><div class="row"><div class="t-title-m" id="h-tasks" style="margin:0;flex:1">Tasks</div><button class="btn text" id="clearBtn">Clear finished</button></div><div id="taskList"></div></div>
  </section>
  <section class="page" id="tab-settings">
    <div class="card"><div class="t-title-m" id="h-gui">Application</div>
      <div class="field"><label>vfox</label><div class="row"><input id="setVfox" size="30"><button id="saveVfox" class="btn">Save</button></div></div>
      <div class="field"><label>Language</label><div class="row"><div class="seg" id="langSeg"><button data-l="system">system</button><button data-l="english">english</button><button data-l="simplifiedChinese">简体中文</button></div></div></div>
      <div class="field"><label>Extra environment (KEY=value, one per line)</label><textarea id="setEnv" rows="4" cols="50"></textarea><div><button id="saveEnv" class="btn" style="margin-top:6px">Save</button></div></div>
    </div>
    <div class="card"><div class="t-title-m" id="h-config">vfox config</div><div id="configList"></div></div>
  </section>
</main>
</div>
</div>
<button class="mfab" id="fabAddM"><svg class="ic"><use href="#i-add"/></svg><span>Add</span></button>
<nav class="navbar" id="barNav" aria-label="Navigation">
  <button class="dest" data-tab="home"><span class="pill"><svg class="ic line"><use href="#i-home"/></svg><svg class="ic fill"><use href="#i-home-fill"/></svg></span><span class="lbl">Home</span></button>
  <button class="dest" data-tab="sdks"><span class="pill"><svg class="ic line"><use href="#i-deployed-code"/></svg><svg class="ic fill"><use href="#i-deployed-code-fill"/></svg></span><span class="lbl">SDKs</span></button>
  <button class="dest" data-tab="plugins"><span class="pill"><svg class="ic line"><use href="#i-extension"/></svg><svg class="ic fill"><use href="#i-extension-fill"/></svg></span><span class="lbl">Plugins</span></button>
  <button class="dest" data-tab="tasks"><span class="pill"><svg class="ic line"><use href="#i-pending-actions"/></svg><svg class="ic fill"><use href="#i-pending-actions-fill"/></svg></span><span class="lbl">Tasks</span><span class="bdg" id="taskCountM" hidden></span></button>
  <button class="dest" data-tab="settings"><span class="pill"><svg class="ic line"><use href="#i-settings"/></svg><svg class="ic fill"><use href="#i-settings"/></svg></span><span class="lbl">Settings</span></button>
</nav>

<div class="menu" id="menu"></div>

/* fade-through page switch */
let curTab = null;
function switchTab(name, push) {
  if (curTab === name) return;
  curTab = name;
  document.body.dataset.tab = name;
  document.querySelectorAll(".dest").forEach(b => b.setAttribute("aria-current", b.dataset.tab === name ? "true" : "false"));
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active", "enter"));

function route() {
  const h = (location.hash || "#/home").slice(2);
  const parts = h.split("/");
  if (parts[0] === "sdk" && parts[1]) { showDetail(parts[1], false); switchTab("sdks", false); return; }

}

/* snackbar */
function snack(msg, action, onclick) {
  const box = document.getElementById("snacks");
  const el = document.createElement("div");
  el.className = "snack";
  el.innerHTML = "<span>" + esc(msg) + "</span>" + (action ? '<button>' + esc(action) + "</button>" : "");
  if (action) el.querySelector("button").onclick = () => { dismiss(); onclick && onclick(); };
  box.appendChild(el);

  function dismiss() { if (!gone) { gone = true; el.remove(); } }
  setTimeout(dismiss, action ? 8000 : 4000);
}

/* dialog returns a promise */
function confirmDlg(title, body, okLabel, danger) {
  return new Promise(resolve => {
    const scrim = document.getElementById("scrim");
    document.getElementById("dlgTitle").textContent = title;
    document.getElementById("dlgBody").textContent = body;
    const ok = document.getElementById("dlgOk");
    ok.textContent = okLabel; ok.className = "btn " + (danger ? "danger" : "primary");
    scrim.classList.add("open");
    const done = v => { scrim.classList.remove("open"); ok.onclick = null; document.getElementById("dlgCancel").onclick = null; scrim.onclick = null; resolve(v); };
    ok.onclick = () => done(true);
    document.getElementById("dlgCancel").textContent = t("cancel");
    document.getElementById("dlgCancel").onclick = () => done(false);
    scrim.onclick = ev => { if (ev.target === scrim) done(false); };
  });

/* popup menu */
function openMenu(anchor, items) {
  const menu = document.getElementById("menu");
  menu.innerHTML = "";
  items.forEach(it => {
    const b = document.createElement("button");
    if (it.danger) b.className = "danger";
    b.innerHTML = icon(it.icon) + "<span>" + esc(it.label) + "</span>";
    b.onclick = () => { closeMenu(); it.onclick && it.onclick(); };
    menu.appendChild(b);
  });
  const r = anchor.getBoundingClientRect();
  menu.classList.add("open");
  const mw = 220, mh = items.length * 48 + 16;
  menu.style.minWidth = mw + "px";
  let x = Math.min(r.left, innerWidth - mw - 8), y = r.bottom + 6;
  if (y + mh > innerHeight - 8) y = Math.max(8, r.top - mh - 6);
  menu.style.left = Math.max(8, x) + "px"; menu.style.top = y + "px";
  setTimeout(() => document.addEventListener("click", closeMenu, {once: true}), 0);
}
function closeMenu() { document.getElementById("menu").classList.remove("open"); }
/* api */
async function api(path, opts) {
  opts = opts || {};
  opts.headers = Object.assign({"Content-Type": "application/json"}, opts.headers || {});
  opts.credentials = "same-origin";
  const r = await fetch(path, opts);
  if (r.status === 401) { location.href = "/"; throw new Error(t("needSession")); }
  if (!r.ok) { const text = await r.text(); throw new Error(text || t("failed")); }
  if (r.status === 204) return null;
  return r.json();
}

function wavy(progress, indeterminate) {
  const wave = '<svg width="120" height="8" viewBox="0 0 120 8" preserveAspectRatio="none"><path d="M0 4 Q 10 0 20 4 T 40 4 T 60 4 T 80 4 T 100 4 T 120 4" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/></svg>';

async function refresh(full) {
  try {

    cache.tasks = tasks;

  if (full && cache.detail) showDetail(cache.detail, true);

function watchTasks(tasks) {
  tasks.forEach(task => {
    const prev = prevTasks[task.id];
    if (prev && ["queued","running"].includes(prev) && ["succeeded"].includes(task.status)) snack(t("taskSucceeded"), t("view"), () => { location.hash = "#/tasks"; });
    if (prev && ["queued","running"].includes(prev) && ["failed","cancelled"].includes(task.status)) snack((task.errorMessage || t("taskFailed")), t("view"), () => { location.hash = "#/tasks"; });
  });
  prevTasks = {};
  tasks.forEach(task => prevTasks[task.id] = task.status);
}
function sectionStatus(sec) {
  if (!sec) return '<p class="muted">' + esc(t("loading")) + "</p>";
  if (sec.loading && (!sec.value || !sec.value.length)) return spinner();
  if (sec.error && (!sec.value || !sec.value.length)) return stateBlock("err", "error", t("failed"), esc(sec.error), t("refresh"), null);
  return "";
}

/* ---------------- sdks ---------------- */
document.getElementById("sdkSearch").oninput = () => renderSdks(cache.inventory);
document.getElementById("sdkRefresh").onclick = () => refresh(true);
function renderSdks(inv) {

function showList(push) {

async function showDetail(name, keep) {
  cache.detail = name; cache.versions = null;

      '<button class="iconbtn sm" id="detailMenu" title="…">' + icon("more-vert", "sm") + "</button></div>";
    if (info) h += "<p class='muted t-body'>" + esc(info.Description || "") + (info.Homepage ? ' <a href="' + esc(info.Homepage) + '" target="_blank" rel="noreferrer">' + esc(t("homepage")) + "</a>" : "") + "</p>";
    if (sdk && sdk.Versions && sdk.Versions.length) {
      h += "<div class='t-title-m'>" + esc(t("installed")) + " (" + sdk.Versions.length + ")</div><div class='list'>";
      sdk.Versions.forEach(v => {
        const isCur = sdk.HasCurrent && sdk.Current === v;
        h += "<div class='item'><span style='flex:1'><code>" + esc(v) + "</code>" + (isCur ? ' <span class="tag cur">' + esc(t("current")) + "</span>" : "") + "</span>" +
          (isCur ? "" : "<button class='btn text' data-use='" + esc(v) + "'>" + esc(t("use")) + "</button>") +
          " <button class='btn text' data-uninstall='" + esc(v) + "'>" + esc(t("uninstall")) + "</button></div>";
      });
      h += "</div>";
    }
    h += "<div class='t-title-m' style='margin-top:12px'>" + esc(t("versions")) + "</div><div class='row'><div class='search' style='flex:1;margin:0'><svg class='ic sm muted'><use href='#i-search'/></svg><input id='vSearch' placeholder='" + esc(t("search")) + "'></div>" +
      "<div class='seg' id='vFilter'><button data-vf='all' aria-pressed='true'>" + esc(t("allVersions")) + "</button><button data-vf='note' aria-pressed='false'>" + esc(t("withNote")) + "</button><button data-vf='installed' aria-pressed='false'>" + esc(t("installedOnly")) + "</button></div></div>" +
      "<div class='row'><input id='vCustom' placeholder='x.y.z' size='10'><button id='vInstall' class='btn primary'>" + esc(t("install")) + "</button></div><div id='vList' class='list' style='margin-top:8px'></div>";
    box.innerHTML = h;
    document.getElementById("detailBack").onclick = () => showList(true);
    document.getElementById("detailMenu").onclick = ev => {
      const items = [];
      if (info && info.Homepage) items.push({icon: "open-in-new", label: t("homepageOpen"), onclick: () => window.open(info.Homepage, "_blank", "noreferrer")});
      if (info && info.InstallPath) items.push({icon: "content-copy", label: t("copyPath"), onclick: () => copyText(info.InstallPath)});
      items.push({icon: "delete", label: t("remove"), danger: true, onclick: () => removePlugin(name)});
      openMenu(ev.currentTarget, items);
    };
    const drawVersions = () => {
      const q = (document.getElementById("vSearch").value || "").toLowerCase();
      const f = (box.querySelector("#vFilter [aria-pressed=true]") || {}).dataset?.vf || "all";
      const list = document.getElementById("vList");
      const rows = (cache.versions || []).filter(v => {
        if (f === "note" && !v.HasNote) return false;
        if (f === "installed" && !v.Installed) return false;
        return !q || v.Version.toLowerCase().includes(q) || (v.Note || "").toLowerCase().includes(q);
      }).slice(0, 200);
      list.innerHTML = rows.map(v => "<div class='item'><span style='flex:1'><code>" + esc(v.Version) + "</code>" +
        (v.HasNote ? ' <span class="tag">' + esc(v.Note) + "</span>" : "") +
        ((v.Additions || []).length ? ' <span class="muted t-label">' + esc(v.Additions.map(a => a.Version ? a.Name + " " + a.Version : a.Name).join(", ")) + "</span>" : "") +
        (v.Installed ? ' <span class="tag">✓</span>' : "") + "</span>" +
        (v.Installed ? "" : "<button class='btn text' data-install='" + esc(v.Version) + "'>" + esc(t("install")) + "</button>") + "</div>").join("");
      list.querySelectorAll("[data-install]").forEach(b => b.onclick = () => runTask({operation: "install", sdk: name, version: b.dataset.install}));
    };
    document.getElementById("vSearch").oninput = drawVersions;
    box.querySelectorAll("#vFilter button").forEach(b => b.onclick = () => { box.querySelectorAll("#vFilter button").forEach(x => x.setAttribute("aria-pressed", x === b ? "true" : "false")); drawVersions(); });
    drawVersions();
    document.getElementById("vInstall").onclick = () => { const v = document.getElementById("vCustom").value.trim(); if (v) runTask({operation: "install", sdk: name, version: v}); };
    box.querySelectorAll("[data-use]").forEach(b => b.onclick = () => runTask({operation: "use", sdk: name, version: b.dataset.use, scope: "global"}));
    box.querySelectorAll("[data-uninstall]").forEach(b => b.onclick = async () => { if (await confirmDlg(t("uninstall"), b.dataset.uninstall, t("uninstall"), true)) runTask({operation: "uninstall", sdk: name, version: b.dataset.uninstall}); });
  } catch (e) { box.innerHTML = '<p class="bad">' + esc(e.message) + "</p>"; }

async function copyText(s) { try { await navigator.clipboard.writeText(s); snack(t("copied")); } catch (e) { showError(t("failed")); } }
async function removePlugin(name) {

}
async function runTask(req) {
  try {
    const task = await api("/api/tasks", {method: "POST", body: JSON.stringify(req)});
    location.hash = "#/tasks";
    await refresh(false);
  } catch (e) { showError(e.message); }

/* ---------------- plugins ---------------- */
document.getElementById("pluginSearch").oninput = () => renderPlugins(cache.inventory);
document.querySelectorAll("#pluginFilter button").forEach(b => b.onclick = () => {
  document.querySelectorAll("#pluginFilter button").forEach(x => x.setAttribute("aria-pressed", x === b ? "true" : "false"));
  renderPlugins(cache.inventory);
});
document.getElementById("regRefresh").onclick = () => refresh(true);
function pluginFilter() { return (document.querySelector("#pluginFilter [aria-pressed=true]") || {}).dataset?.f || "all"; }
function renderPlugins(inv) {
  if (!inv) return;
  const box = document.getElementById("pluginList");
  const sec = inv.registry;

  box.innerHTML = list.map(p =>

    (p.Homepage ? '<div class="muted t-label" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(p.Homepage) + "</div>" : "") +

    (installed.has(p.Name)
      ? '<button class="btn text" data-open="' + esc(p.Name) + '">' + esc(t("added")) + "</button><span style='flex:1'></span><button class='btn text' data-update='" + esc(p.Name) + "'>" + esc(t("update")) + "</button><button class='btn text' data-remove='" + esc(p.Name) + "'>" + esc(t("remove")) + "</button>"
      : '<button class="btn primary" data-addname="' + esc(p.Name) + '">' + esc(t("install")) + "</button>") + "</div></div>").join("");

document.getElementById("addBtn").onclick = () => {

document.getElementById("updateAllBtn").onclick = () => runTask({operation: "update"});
/* ---------------- tasks ---------------- */
function statusIcon(st) {
  return {queued: "hourglass-empty", running: "schedule", succeeded: "task-alt", failed: "error", cancelled: "close"}[st] || "info";
}
function renderTasks() {
  const box = document.getElementById("taskList");
  ["taskCount", "taskCountM"].forEach(id => {
    const badge = document.getElementById(id);
    if (badge) { const n = cache.tasks.filter(x => ["queued","running"].includes(x.status)).length; badge.hidden = n === 0; badge.textContent = n; }
  });
  if (!cache.tasks.length) { box.innerHTML = stateBlock("empty", "pending-actions", t("noTasks"), "", null); return; }
  box.innerHTML = "";
  cache.tasks.forEach(task => {
    const d = document.createElement("div");
    d.className = "card";
    const pct = task.progress != null ? Math.round(task.progress * 100) + "%" : "";
    d.innerHTML = "<div class='row'>" + icon(statusIcon(task.status)) + "<b>" + esc(task.operation) + "</b> <code>" + esc(task.sdk + (task.version ? "@" + task.version : "")) + "</code> <span class='muted t-label'>" + esc(task.status + " " + pct) + "</span><span style='flex:1'></span><button class='btn text' data-open='" + task.id + "'>" + esc(t("log")) + "</button></div>" +
      (task.progress != null && ["queued","running"].includes(task.status) ? wavy(task.progress, false) : "") +
      (["queued","running"].includes(task.status) && task.progress == null ? wavy(0, true) : "") +
      (task.errorMessage ? "<p style='color:var(--m3-error)'>" + esc(task.errorMessage) + "</p>" : "") +
      "<div data-log='" + task.id + "' hidden></div>";
    box.appendChild(d);
  });
  box.querySelectorAll("[data-open]").forEach(b => b.onclick = () => openTask(parseInt(b.dataset.open, 10)));
}
async function openTask(id) {
  const slot = document.querySelector("[data-log='" + id + "']");
  if (!slot) return;
  if (!slot.hidden) { slot.hidden = true; slot.innerHTML = ""; return; }
  try {
    const task = await api("/api/tasks/" + id);
    slot.hidden = false;
    slot.innerHTML = "<p class='muted'><code>" + esc(task.commandLine) + "</code></p>" + (task.droppedLines ? "<p class='muted'>" + esc(t("droppedHead") + task.droppedLines + t("droppedTail")) + "</p>" : "") + (task.hasFullLog && !isWebView() ? "<div class='row'><a class='btn text' download href='/api/tasks/" + task.id + "/log'>" + esc(t("downloadLog")) + "</a></div>" : "") + "<pre class='log'>" + esc(task.log.join("\n")) + "</pre><div class='row'>" +
      (["queued","running"].includes(task.status) ? "<button class='btn danger' data-cancel='" + id + "'>" + esc(t("cancel")) + "</button>" : "") +
      (["failed","cancelled"].includes(task.status) ? "<button class='btn' data-retry='" + id + "'>" + esc(t("retry")) + "</button>" : "") + "</div>";
    const c = slot.querySelector("[data-cancel]");
    if (c) c.onclick = async () => { await api("/api/tasks/" + id + "/cancel", {method: "POST"}); refresh(false); };
    const r = slot.querySelector("[data-retry]");
    if (r) r.onclick = async () => { await api("/api/tasks/" + id + "/retry", {method: "POST"}); refresh(false); };
  } catch (e) { showError(e.message); }
}
document.getElementById("clearBtn").onclick = async () => { try { await api("/api/tasks/finished", {method: "DELETE"}); refresh(false); } catch (e) { showError(e.message); } };
/* ---------------- settings ---------------- */
function renderSettings(inv) {
  api("/api/settings").then(s => {
    if (document.activeElement !== document.getElementById("setVfox")) document.getElementById("setVfox").value = s.vfoxExecutable || "";
    document.querySelectorAll("#langSeg button").forEach(b => b.setAttribute("aria-pressed", (b.dataset.l === (s.language || "system")) ? "true" : "false"));
    if (document.activeElement !== document.getElementById("setEnv")) document.getElementById("setEnv").value = Object.entries(s.extraEnvironment || {}).map(([k, v]) => k + "=" + v).join("\n");
  }).catch(() => {});
  const sec = inv.config;
  const box = document.getElementById("configList");
  const st = sectionStatus(sec);
  if (st) { box.innerHTML = st; wireStateRetry(box, () => refresh(true)); return; }
  box.innerHTML = "<table><tr><th>" + esc(t("key")) + "</th><th>" + esc(t("value")) + "</th><th>" + esc(t("actions")) + "</th></tr>" + (sec.value || []).map(c =>
    "<tr><td><code>" + esc(c.Key) + "</code></td><td>" + esc(c.Value || t("empty")) + "</td><td><button class='btn text' data-edit='" + esc(c.Key) + "'>" + esc(t("edit")) + "</button> <button class='btn text' data-reset='" + esc(c.Key) + "'>" + esc(t("reset")) + "</button></td></tr>").join("") + "</table>";
  box.querySelectorAll("[data-edit]").forEach(b => b.onclick = async () => {
    const cur = ((sec.value || []).find(c => c.Key === b.dataset.edit) || {}).Value || "";

    try { await vfoxConfig(b.dataset.edit, v); refresh(false); } catch (e) { showError(e.message); }

async function vfoxConfig(key, value) {
  if (value == null) return api("/api/config?key=" + encodeURIComponent(key), {method: "DELETE"});
  return api("/api/config", {method: "PUT", body: JSON.stringify({key, value})});
}
document.getElementById("saveVfox").onclick = async () => { try { await api("/api/settings", {method: "PUT", body: JSON.stringify({vfoxExecutable: document.getElementById("setVfox").value.trim()})}); refresh(false); } catch (e) { showError(e.message); } };
document.getElementById("saveEnv").onclick = async () => {
  const env = {};
  document.getElementById("setEnv").value.split("\n").forEach(line => { const i = line.indexOf("="); if (i > 0) env[line.slice(0, i).trim()] = line.slice(i + 1); });
  try { await api("/api/settings", {method: "PUT", body: JSON.stringify({extraEnvironment: env})}); refresh(false); } catch (e) { showError(e.message); }
};
document.querySelectorAll("#langSeg button").forEach(b => b.onclick = async e => {
  try { await api("/api/settings", {method: "PUT", body: JSON.stringify({language: b.dataset.l})}); } catch (err) { showError(err.message); }
});
function wireStateRetry(root, fn) { const b = root.querySelector("[data-act]"); if (b) b.onclick = fn; }
/* ---------------- events ---------------- */
function connectEvents() {
  let es;
  try { es = new EventSource("/api/events"); } catch (e) { setLive(false); return; }
  es.onopen = () => setLive(true);
  es.onerror = () => { setLive(false); es.close(); setTimeout(connectEvents, 3000); };
  es.addEventListener("task", () => refresh(false));
  es.addEventListener("inventory", () => refresh(false));
  es.addEventListener("vfox", () => refresh(false));
  es.addEventListener("hello", () => refresh(true));
}
renderChrome();
route();
refresh(true);
connectEvents();
