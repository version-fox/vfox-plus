# The Gradle that ./gradlew runs (Gradle Wrapper Neo, see
# docs/en/dev/packaging-android.md). The checksums are listed at
# https://gradle.org/release-checksums/.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# services.gradle.org redirects to a GitHub release now, and GitHub answers
# 504 often enough to fail CI. The mirror serves the same archive, whose
# SHA-256 below is the official one, so the wrapper still checks every byte.
distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-9.5.1-bin.zip
distributionSha256Sum=bafc141b619ad6350fd975fc903156dd5c151998cc8b058e8c1044ab5f7b031f
# CI downloads the 130 MB distribution on a cold cache: five minutes and three
# tries keep a slow runner from failing the build, as one did with ten seconds.
networkTimeout=300000
retries=3
retryBackOffMs=2000
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
