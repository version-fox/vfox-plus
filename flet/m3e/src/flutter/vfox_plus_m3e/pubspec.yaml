name: vfox_plus_m3e
description: The Material 3 Expressive widgets of vfox+ that Flet lacks, as Flet controls.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

# Every runtime dependency must be licensed under terms that are compatible
# with, or no more restrictive than, the Apache License 2.0.
# See ../../../../../docs/architecture.md#dependencies before adding a new one.
dependencies:
  flutter:
    sdk: flutter
  # Apache-2.0. The Flutter side of Flet: controls, extensions and parsers.
  flet: 1.0.4
  # MIT. Port of androidx.graphics.shapes: Material shapes and shape morphing,
  # the same package the Flutter implementation uses.
  material_new_shapes: 1.0.0
  # BSD-3-Clause. Fade-through and shared-axis transitions. 3.x needs the
  # material_ui package, which needs a newer Flutter than Flet's.
  animations: 2.2.0

dev_dependencies:
  flutter_lints: 6.0.0

flutter:
  fonts:
    # The icons of shared/icons.json cut out of Material Symbols Rounded with
    # shared/tools/icon_font.py by tools/prepare.py (not committed).
    - family: MaterialSymbolsRounded
      fonts:
        - asset: fonts/MaterialSymbolsRounded.ttf
