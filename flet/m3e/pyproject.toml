# A Flet extension: the Python controls in src/vfox_plus_m3e and the Flutter
# package that renders them in src/flutter/vfox_plus_m3e, which `flet build`
# finds in the installed package and adds to the Flutter app.
[project]
name = "vfox-plus-m3e"
version = "0.1.0"
description = "The Material 3 Expressive widgets of vfox+ that Flet lacks, as Flet controls."
license = "Apache-2.0"
requires-python = ">=3.14"
dependencies = [
  # Apache-2.0. The controls this package extends.
  "flet==1.0.5",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
"vfox_plus_m3e" = ["py.typed"]
# The Flutter package, including the generated icon font.
"flutter.vfox_plus_m3e" = ["pubspec.yaml", "analysis_options.yaml", "lib/**", "fonts/**"]

[tool.setuptools]
license-files = []
