[project]
name = "vfox-plus"
version = "0.1.0"
description = "Material 3 Expressive desktop GUI for the vfox version manager."
license = "Apache-2.0"
# `flet build` bundles the newest Python that this allows.
requires-python = ">=3.14"
# Every runtime dependency must be licensed under terms that are compatible
# with, or no more restrictive than, the Apache License 2.0.
# See ../docs/architecture.md#dependencies before adding a new one.
dependencies = [
  # Apache-2.0. The user interface framework.
  "flet==1.0.4",
  # Apache-2.0. The Material 3 Expressive widgets that Flet lacks (m3e/).
  "vfox-plus-m3e",
]

[dependency-groups]
dev = [
  # Apache-2.0. `flet build` and the development client of `flet run`.
  "flet-cli==1.0.4",
  "flet-desktop==1.0.4",
  # MIT, Apache-2.0 and MIT. Tests, asynchronous tests and their coverage.
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.1.0",
  # MIT. Linter and formatter.
  "ruff==0.17.1",
  # MIT. Type checker.
  "mypy==2.4.0",
  # MIT and MIT. Build backend of the local extension, used with
  # PIP_NO_BUILD_ISOLATION=1 so that `flet build` does not download it.
  "setuptools==84.0.0",
  "wheel==0.48.0",
]

[tool.uv.sources]
vfox-plus-m3e = { path = "m3e", editable = true }

[tool.flet]
org = "dev.vfox"
bundle_id = "dev.vfox.VfoxPlus"
product = "vfox+"
company = "vfox"
copyright = "Copyright 2026 Han Li and contributors"

[tool.flet.app]
path = "src"

[tool.flet.dev_packages]
vfox-plus-m3e = "m3e"

# The exact versions that `flet build` puts into the Flutter app, so that
# rebuilds resolve the same transitive dependencies (Flet pins its own).
[tool.flet.flutter.pubspec.dependencies]
cupertino_icons = "1.0.9"
msgpack_dart = "1.0.1"
package_info_plus = "9.0.1"
path = "1.9.1"
path_provider = "2.1.6"
serious_python = "5.0.0"
window_manager = "0.5.2"

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["--strict-markers", "--import-mode=importlib"]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/vfox_plus"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 120
target-version = "py314"
src = ["src", "tests", "tools", "m3e/src"]
# Build outputs and caches, also ignored for version control (ruff respects
# .gitignore, but the sandbox works on a copy without one).
exclude = ["build", "dist", ".venv", "__pycache__", ".mypy_cache", ".ruff_cache", ".pytest_cache", ".git"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "PL", "PT", "BLE", "D"]
ignore = [
  # Docstrings: public modules and classes are documented, not every method
  # and test.
  "D100", "D102", "D103", "D104", "D105", "D107",
  # Docstrings start on the first line and may continue on the next.
  "D200", "D205", "D212", "D213", "D400", "D401", "D415", "D203",
  # Test and UI functions take many arguments and branch a lot.
  "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917", "PLR2004",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "PLC0415"]
# Flet components are named like the controls they render.
"src/vfox_plus/ui/**" = ["N802"]

[tool.ruff.lint.isort]
known-first-party = ["vfox_plus", "vfox_plus_m3e", "support"]

[tool.mypy]
python_version = "3.14"
mypy_path = ["src", "tests", "m3e/src"]
files = ["src", "tests", "m3e/src"]
strict = true
explicit_package_bases = true

[[tool.mypy.overrides]]
# Tests check state that changes between two assertions, and call into the
# internals of Flet, which are not typed.
module = ["core.*", "state.*", "ui.*"]
disable_error_code = ["comparison-overlap", "no-untyped-call"]
