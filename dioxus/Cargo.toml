[package]
name = "vfox-plus"
version = "0.1.0"
description = "Material 3 Expressive desktop GUI for the vfox version manager, built with Dioxus."
license = "Apache-2.0"
repository = "https://github.com/version-fox/vfox-plus"
edition = "2024"
rust-version = "1.88"
publish = false

# Every dependency must be licensed under terms compatible with the Apache
# License 2.0; see ../docs/architecture.md#dependencies.
# ../shared/tools/cargo_licenses.py checks it and collects the license texts.
[dependencies]
# MIT OR Apache-2.0. The user interface, in the web view of the system.
dioxus = { version = "0.7.10", features = ["desktop"] }
# MIT. Processes, their output and timers.
tokio = { version = "1", features = ["process", "io-util", "rt", "time", "macros", "sync"] }
# MIT OR Apache-2.0. The settings file and the translation catalogues; the
# order of the keys of the settings file is kept.
serde_json = { version = "1", features = ["preserve_order"] }
# MIT OR Apache-2.0. Values exchanged with the page.
serde = "1"
# MIT OR Apache-2.0. The tonal spot scheme of the Material colour utilities.
material-colors = "0.5"
# MIT OR Apache-2.0. The icon font, inlined into the page.
base64 = "0.23"
# MIT. Cancels vfox with SIGTERM.
nix = { version = "0.31", default-features = false, features = ["signal"] }
# MIT OR Apache-2.0. Private copies of local plugins.
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
# MIT. The program name, which names the window after the application ID,
# the clipboard and the file choosers. The versions are those of the GTK
# bindings of Dioxus.
glib = "0.21"
gtk = "0.18"

[features]
# The end-to-end scenarios, which the application runs when
# VFOX_PLUS_E2E_SCENARIO names one; see README.md. They talk to the test
# server over TCP.
e2e = ["tokio/net"]

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
needless_pass_by_value = "allow"
# Components take their properties by value and are named like elements.
must_use_candidate = "allow"
# The handles of the state (signals and the structures of them) are Copy and
# meant to be passed by value.
large_types_passed_by_value = "allow"
# Every fallible operation of vfox fails with a VfoxError, which describes the
# failures.
missing_errors_doc = "allow"
# The markup of a page or of a scenario is long.
too_many_lines = "allow"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
